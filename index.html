<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>O que ganha de...?</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>:root{
  --ink:#0e2a47;--card:#ffffff;--edge:#0e2a47;--accent:#1f6bff;--good:#15b863;--bad:#f0344a;--miss:#ff8a1f;--gold:#ffe14d;
  --txt:#0e2a47;--sb:rgba(14,42,71,.35);--sz:200px;--namefs:34px;--btxt:#ffffff;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --hex:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--body);font-weight:800;color:var(--ink);background:#c9f4ff}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- fundo (preenche a janela inteira) ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:filter 1.2s}
#bgl{position:absolute;inset:0}
.bgl{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background-size:cover;background-position:center}
.bgl.on{opacity:1}
.rays{position:absolute;left:50%;top:42%;width:230vmax;height:230vmax;transform:translate(-50%,-50%);opacity:0;transition:opacity 2s;visibility:hidden;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.34) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 50s linear infinite;animation-play-state:paused}
body.raios .rays{opacity:1;visibility:visible;animation-play-state:running}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hexmark{position:absolute;left:50%;top:52%;width:min(66vmin,540px);aspect-ratio:1;transform:translate(-50%,-50%);clip-path:var(--hex);background:var(--hexcor,rgba(255,255,255,.28));transition:background 1.5s,opacity 1.5s;opacity:0}
body.hexon .hexmark{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;opacity:0;transition:opacity 1.5s;box-shadow:inset 0 0 18vmin rgba(0,0,0,.7)}
body.vinheta .vig{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
body.gameover #bg,body.gameover .arena{filter:grayscale(1) brightness(.6)}

/* ---------- palco 1920x1080 ---------- */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;transform:translate(-50%,-50%);z-index:1;overflow:hidden}
body.nocorte #stage{overflow:visible}
.screen{display:none;position:absolute;inset:0}
.screen.on{display:block}
.L{position:absolute;display:flex;align-items:center;justify-content:center;font-size:var(--fs,20px);text-align:center}
.L.l-off{display:none!important}
.btn{font-family:var(--display);background:var(--accent);color:var(--btxt);border:3px solid var(--edge);border-radius:18px;
  box-shadow:0 5px 0 var(--edge);padding:.3em 1em;cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink)}
.bigtitle{font-family:var(--display);font-weight:400;line-height:.95;margin:0;color:var(--tcor,#fff);-webkit-text-stroke:.035em var(--edge);paint-order:stroke fill;text-shadow:0 .07em 0 var(--edge)}
.subtitle{font-weight:800;color:var(--txt);margin:0}
.hint{font-weight:800;color:var(--txt);opacity:.85;margin:0}
.hexph{width:56px;height:56px;flex:none;background:var(--edge);clip-path:var(--hex);display:grid;place-items:center}
.ph-in{width:calc(100% - 7px);height:calc(100% - 7px);clip-path:var(--hex);background:#fff center/cover no-repeat;display:grid;place-items:center;
  font-family:var(--display);font-size:calc(1em + 10px);color:var(--edge)}
.nameinput{font-family:var(--display);font-size:inherit;width:8em;border:2px solid var(--edge);border-radius:8px;padding:0 6px;color:var(--ink)}

/* ---------- lobby ---------- */
.slots{gap:1.6em}
.slot{background:var(--card);border:3px solid var(--edge);border-radius:1.3em;box-shadow:0 6px 0 var(--edge);padding:.9em .8em;width:12.5em;display:flex;flex-direction:column;align-items:center;gap:.5em}
.slot .hexph{width:5.6em;height:5.6em;font-size:1.6em}
.slot .hexph{font-size:1em;width:5.6em;height:5.6em}
.slot .pname{font-family:var(--display);font-size:1.2em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .state{font-weight:800;font-size:.65em;color:#4a6a82}
.slot .btn{font-size:.9em}
.slot.mine{box-shadow:0 0 0 4px var(--gold),0 6px 0 var(--edge)}
.mine .hexph,.mine .pname,.slot .hexph,.slot .pname{cursor:pointer}
.lbtns{gap:14px}
.lbtns .btn{font-size:1em}
.badge{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font:800 12px var(--body);background:var(--gold);border:2px solid var(--edge);border-radius:999px;padding:3px 12px;z-index:30}

/* ---------- jogo ---------- */
.pbox{justify-content:flex-start}
.pbox.right{justify-content:flex-end}
.pcard{height:100%;max-width:100%;display:flex;align-items:center;background:var(--card);border:3px solid var(--edge);border-radius:999px;box-shadow:0 4px 0 var(--edge);
  position:relative;transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .35s;transform-origin:left center}
.pcard.right{transform-origin:right center;flex-direction:row-reverse}
.pcard .hexph{width:calc(var(--h) - 16px);height:calc(var(--h) - 16px);margin:0 .4em 0 5px;font-size:calc(var(--h) * .3)}
.pcard.right .hexph{margin:0 5px 0 .4em}
.pinfo{display:flex;flex-direction:column;min-width:0;line-height:1.1;padding-right:.8em;align-items:flex-start}
.pcard.right .pinfo{align-items:flex-end;padding-right:0;padding-left:.8em}
.pcard .pname{font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hearts{font-family:var(--emoji);font-size:.75em;letter-spacing:1px;white-space:nowrap}
.hearts:empty{display:none}
.hearts .lost{filter:grayscale(1);opacity:.35}
.brokeheart{position:absolute;left:0;top:0;font-family:var(--emoji);font-size:44px;z-index:30;pointer-events:none}
.pcard.active{transform:scale(1.1);box-shadow:0 0 0 4px var(--gold),0 4px 0 var(--edge),0 0 34px var(--gold)}
.pcard .ptag{position:absolute;bottom:-.75em;left:calc(var(--h) * .5);transform:translateX(-50%);background:var(--gold);border:2px solid var(--edge);font-family:var(--display);font-size:.62em;padding:0 9px;border-radius:8px;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:2}
.pcard.right .ptag{left:auto;right:calc(var(--h) * .5);transform:translateX(50%)}
.pcard.active .ptag{opacity:1}
.pcard.off{opacity:.55}
.pcard.crowned::before{content:"👑";font-family:var(--emoji);position:absolute;top:-.95em;left:.4em;font-size:1.4em;animation:bob 2s ease-in-out infinite;z-index:3}
.pcard.right.crowned::before{left:auto;right:.4em}
.pill{font-family:var(--display);background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:.1em .8em;box-shadow:0 3px 0 var(--edge);white-space:nowrap}
.pill:empty{display:none}
.lvpill{background:var(--gold)}
#verdict{font-family:var(--display);line-height:1.03;color:var(--vcor,#fff);-webkit-text-stroke:.05em var(--edge);paint-order:stroke fill;text-shadow:0 .075em 0 var(--edge);width:100%}
#verdict .it{color:var(--itcor,var(--gold))}
#verdict.win{color:var(--good)} #verdict.miss{color:var(--miss)} #verdict.lose{color:var(--bad)}
#sub{font-weight:900;color:var(--txt);width:100%}
.arena{overflow:hidden;transition:filter 1.2s}
body.nocorte .arena{overflow:visible}
.ent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;will-change:transform}
#def{z-index:2}#att{z-index:3;opacity:0}
.vis{width:var(--sz);height:var(--sz);display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--sz)*.8);line-height:1;filter:drop-shadow(0 7px 0 rgba(14,42,71,.28))}
.vis img{width:100%;height:100%;object-fit:contain;padding:5%}
.ent .name{position:relative;z-index:1;font-family:var(--display);font-size:var(--namefs);background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:.05em .7em;white-space:nowrap;box-shadow:0 4px 0 var(--edge)}
body.nonome .ent .name{display:none}
.champ .vis{animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 0 22px #fff) drop-shadow(0 7px 0 rgba(14,42,71,.28))}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.06)}}
.part{position:absolute;left:50%;top:50%;pointer-events:none;font-family:var(--emoji);z-index:4;line-height:1}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:8px solid rgba(255,214,110,.9);box-shadow:0 0 30px rgba(255,190,60,.8),inset 0 0 20px rgba(255,190,60,.6);pointer-events:none;z-index:1}
.flash{position:absolute;inset:-20%;background:radial-gradient(circle,#fff 25%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;z-index:5}
.passbox{pointer-events:none}
.passban{display:none;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:999px;
  padding:6px 20px 6px 6px;box-shadow:0 5px 0 var(--edge);font-family:var(--display);white-space:nowrap}
.passban .hexph{width:1.9em;height:1.9em;font-size:.6em}
#inp{width:100%;height:100%;min-width:0;background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:18px;padding:0 .7em;font:inherit;font-weight:900;font-size:1em;box-shadow:0 5px 0 var(--edge);caret-color:var(--accent);text-align:left}
#inp::placeholder{color:#6b879b;font-weight:800}
#inp.myturn{box-shadow:0 0 0 4px var(--gold),0 5px 0 var(--edge)}
.btnbox .btn{width:100%;height:100%;font-size:1em;padding:0 .4em}
.chainbox{justify-content:flex-start}
.chain{display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;width:100%;height:100%;padding:6px 6px;scroll-behavior:smooth;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.chain>:first-child{margin-left:auto}.chain>:last-child{margin-right:auto}
.wrapc .chain>:first-child,.wrapc .chain>:last-child{margin:0}
.chain.over{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px);mask-image:linear-gradient(90deg,transparent 0,#000 36px)}
.chain .c{flex:none;width:calc(var(--h) - 22px);height:calc(var(--h) - 22px);display:grid;place-items:center;font-family:var(--emoji);font-size:calc((var(--h) - 22px)*.58);background:var(--card);border:2px solid var(--edge);border-radius:12px;position:relative}
.chain .c img{width:78%;height:78%;object-fit:contain}
.chain .c.last{box-shadow:0 0 0 3px var(--gold)}
.chain .c.erra{background:#ffd9b0;opacity:.75}
.chain .c.erra::after,.chain .c.perde::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-family:var(--display);font-size:1.2em}
.chain .c.perde{background:#ffc2c9}
.chain .sep{flex:none;font-weight:900;color:var(--txt);opacity:.6}
#nextBtn{visibility:hidden}
#nextBtn.show{visibility:visible}
#game.resultado [data-l="send"]{visibility:hidden}
.overlay{pointer-events:none;z-index:20}
.bigword{font-family:var(--display);line-height:1;color:#fff;-webkit-text-stroke:.04em var(--edge);paint-order:stroke fill;text-shadow:0 .07em 0 var(--edge),0 0 40px rgba(255,255,255,.6);opacity:0}
.bigword.red{color:var(--bad)}

/* ---------- fim ---------- */
.winner{flex-direction:column}
.winner .hexph{width:calc(var(--h) * .62);height:calc(var(--h) * .62);font-size:calc(var(--h) * .2);margin:0 auto}
.wname{display:inline-block;margin-top:8px}
.winner .crown{font-family:var(--emoji);font-size:calc(var(--h) * .22);animation:bob 2s ease-in-out infinite;margin-bottom:-.15em}
.loserbox{gap:10px;font-weight:900;color:var(--txt)}
.loserbox .hexph{filter:grayscale(1);width:2.6em;height:2.6em;font-size:.8em}
.wrapc .chain{flex-wrap:wrap;justify-content:center;overflow-y:auto;align-content:flex-start}
.wrapc{align-items:flex-start}
.wrapc .chain .c{width:56px;height:56px;font-size:32px}
.wrapc .chain{gap:8px}
.wrapc .chain .sep{display:none}
.loserbox,.winner,#eText,#eTitle{text-align:center}
.soundtip{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;display:none;font-size:18px}
.bannedov{position:absolute;inset:0;z-index:50;display:none;place-items:center;text-align:center;background:rgba(0,0,0,.55)}
.bannedov.on{display:grid}
.bannedov .subtitle{color:#fff;font-size:34px}

/* ---------- edição (engine) ---------- */
#editLayer{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
body.editando #editLayer{display:block}
.eb{position:absolute;border:2px dashed rgba(255,0,170,.75);pointer-events:auto;cursor:move;background:rgba(255,0,170,.04)}
.eb:hover{background:rgba(255,0,170,.1)}
.eb.sel{border:3px solid #ff00aa;background:rgba(255,0,170,.08)}
.eb .lb{position:absolute;left:-2px;top:-26px;background:#ff00aa;color:#fff;font:700 15px system-ui,sans-serif;padding:2px 8px;border-radius:6px 6px 0 0;white-space:nowrap}
.eb.sel .lb{background:#c40084}
.eb .rz{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;background:#ff00aa;border:2px solid #fff;border-radius:4px;cursor:nwse-resize}
.eb.off{opacity:.45;border-style:dotted}
.cam{position:absolute;border:3px dashed rgba(0,200,255,.9);background:repeating-linear-gradient(45deg,rgba(0,200,255,.08) 0 14px,transparent 14px 28px);pointer-events:none;display:none}
.cam span{position:absolute;left:8px;top:6px;font:700 16px system-ui;color:#0090c0;background:#fff;padding:1px 8px;border-radius:6px}
body.editando .cam{display:block}
.ghost-ent{opacity:.55}
.kfdrag{pointer-events:auto!important;cursor:grab;outline:3px dashed #ff00aa;outline-offset:6px}
@media (prefers-reduced-motion:reduce){.champ .vis,.rays,.vig,.pcard.crowned::before,.winner .crown{animation:none}}
</style>

<body>
<div id="bg"><div id="bgl"></div><div class="rays"></div><div class="hexmark"></div><canvas id="fx"></canvas><div class="vig"></div></div>
<div id="stage">
  <section class="screen on" id="lobby">
    <h1 class="L bigtitle" data-l="ltitle" id="lTitle"></h1>
    <p class="L subtitle" data-l="lsub" id="lSub"></p>
    <div class="L slots" data-l="slots" id="slots"></div>
    <div class="L lbtns" data-l="lbuttons"><button class="btn" id="lStart" disabled>Começar</button><button class="btn ghost" id="lLeave" hidden>Sair da vaga</button></div>
    <p class="L hint" data-l="lhint" id="lHint"></p>
  </section>
  <section class="screen" id="game">
    <div class="L pbox" data-l="p1"><div class="pcard" id="c-p1" data-slot="p1"><div class="hexph" data-edit="photo"><div class="ph-in"></div></div><div class="pinfo"><span class="pname" data-edit="name"></span><span class="hearts"></span></div><span class="ptag">VEZ</span></div></div>
    <div class="L pbox right" data-l="p2"><div class="pcard right" id="c-p2" data-slot="p2"><div class="hexph" data-edit="photo"><div class="ph-in"></div></div><div class="pinfo"><span class="pname" data-edit="name"></span><span class="hearts"></span></div><span class="ptag">VEZ</span></div></div>
    <div class="L pillbox" data-l="counter"><span class="pill" id="counter"></span></div>
    <div class="L pillbox" data-l="level"><span class="pill lvpill" id="lvpill"></span></div>
    <div class="L arena" data-l="arena" id="arena">
      <div class="ent" id="def"><div class="vis"></div><div class="name"></div></div>
      <div class="ent" id="att"><div class="vis"></div><div class="name"></div></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="L txtbox" data-l="verdict"><div id="verdict"></div></div>
    <div class="L txtbox" data-l="sub"><div id="sub"></div></div>
    <div class="L passbox" data-l="pass"><div class="passban" id="passban"></div></div>
    <div class="L ansbox" data-l="answer"><input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Resposta"></div>
    <div class="L btnbox" data-l="send"><button class="btn" id="sendBtn">Enviar</button></div>
    <div class="L chainbox" data-l="chain"><div class="chain" id="chain"></div></div>
    <div class="L btnbox" data-l="next"><button class="btn" id="nextBtn">Próximo</button></div>
  </section>
  <section class="screen" id="end">
    <div class="L winner" data-l="ewin"><div class="crown">👑</div><div class="hexph" id="eWin"><div class="ph-in"></div></div><div class="pill wname" id="eWinName"></div></div>
    <h1 class="L bigtitle" data-l="etitle" id="eTitle"></h1>
    <p class="L subtitle" data-l="etext" id="eText"></p>
    <div class="L loserbox" data-l="elose" id="eLose"></div>
    <div class="L chainbox wrapc" data-l="echain"><div class="chain" id="eChain"></div></div>
  </section>
  <div class="L overlay" data-l="lvintro"><div class="bigword" id="lvIntro"></div></div>
  <div class="L overlay" data-l="gotext"><div class="bigword red" id="goText"></div></div>
  <div id="banned" class="bannedov"><div><div class="bigtitle" style="font-size:72px">🚫</div><p class="subtitle" id="bannedTxt">Você não pode entrar nesta sala.</p></div></div>
  <div id="editLayer"></div>
</div>
<button class="btn ghost soundtip" id="soundTip">🔊 Clique para ativar o som</button>
<div class="badge" id="modeBadge" hidden></div>

<script>/* =====================================================================
   NÚCLEO — usado pelo jogo, pelo ADM ao vivo e pela engine
   (regras do roteiro, corações, conexão Firebase/trava ou modo local)
   ===================================================================== */
(function(){
'use strict';
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const other=p=>p==='p1'?'p2':'p1';
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- roteiro ---------- */
function derive(cfg,round){
  let cur=cfg.start,streak=0;
  const chain=[Object.assign({},cfg.start,{res:'start'})];
  for(let j=0;j<round&&j<cfg.steps.length;j++){
    const s=cfg.steps[j];
    chain.push(Object.assign({},s,{res:s.result}));
    if(s.result==='ganha'){cur=s;streak++;}
  }
  return {cur,streak,chain};
}
/* corações: cada erro tira 1; "perde" tira todos. lives 0 = sem corações */
function hearts(cfg,upto){
  const L=Math.max(0,Number(cfg.lives)||0),h={p1:L,p2:L};
  for(let j=0;j<upto&&j<cfg.steps.length;j++){const s=cfg.steps[j];
    if(s.result==='erra')h[s.player]=Math.max(0,h[s.player]-1);else if(s.result==='perde')h[s.player]=0;}
  return h;
}
/* resultado real da rodada r: um erro que zera os corações vira derrota */
function outcome(cfg,r){
  const s=cfg.steps[r];if(!s)return null;
  if(s.result==='ganha')return'ganha';if(s.result==='perde')return'perde';
  if(Number(cfg.lives)>0&&hearts(cfg,r+1)[s.player]<=0)return'perde';
  return'erra';
}
function heartsCheck(cfg){
  const L=Number(cfg.lives)||0,err={p1:0,p2:0};let endAt=-1;
  for(let j=0;j<cfg.steps.length;j++){const s=cfg.steps[j];if(s.result!=='ganha')err[s.player]++;if(outcome(cfg,j)==='perde'){endAt=j;break;}}
  return{lives:L,err,endAt,loser:endAt>=0?cfg.steps[endAt].player:null,total:cfg.steps.length};
}

/* ---------- conexão ---------- */
function firebaseBackend(root){
  const db=firebase.database(),auth=firebase.auth();
  let offset=0;
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0;});
  const R=p=>db.ref(root+(p?'/'+p:''));
  return{
    mode:'firebase',db,auth,root,
    on(path,cb){const r=R(path);const h=s=>cb(s.val());r.on('value',h,e=>console.warn('[sem acesso]',path,e&&e.code));return()=>r.off('value',h);},
    get(path){return R(path).get().then(s=>s.val());},
    set(path,v){return R(path).set(v===undefined?null:clone(v));},
    update(path,v){return R(path).update(clone(v));},
    remove(path){return R(path).remove();},
    tx(path,fn){return R(path).transaction(fn);},
    now(){return Date.now()+offset;},
    uid(){return auth.currentUser?auth.currentUser.uid:'';},
    ensureUser(){
      return new Promise(res=>{
        auth.onAuthStateChanged(u=>{if(u)res(u);else auth.signInAnonymously().catch(e=>console.error(e));});
      });
    }
  };
}
function localBackend(key,mem){
  const K='oqg2-local-'+(key||'jogo');
  let ch=null;if(!mem){try{ch=('BroadcastChannel' in window)?new BroadcastChannel(K):null;}catch(e){ch=null;}}
  let memTree={};
  const read=()=>{if(mem)return memTree;try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return memTree;}};
  let tree=read();const subs=[];
  const parts=p=>String(p||'').split('/').filter(Boolean);
  const getP=(t,p)=>{const v=parts(p).reduce((o,k)=>o==null?null:o[k],t);return v===undefined?null:v;};
  function setP(t,p,v){
    const ps=parts(p);if(!ps.length){return clone(v)||{};}
    let o=t;
    for(let i=0;i<ps.length-1;i++){if(typeof o[ps[i]]!=='object'||o[ps[i]]===null)o[ps[i]]={};o=o[ps[i]];}
    const k=ps[ps.length-1];
    if(v==null)delete o[k];else o[k]=clone(v);
    return t;
  }
  function fire(){subs.forEach(s=>{const j=JSON.stringify(getP(tree,s.path));if(j!==s.last){s.last=j;s.cb(JSON.parse(j));}});}
  function commit(){memTree=tree;if(!mem){try{localStorage.setItem(K,JSON.stringify(tree));}catch(e){}}if(ch)ch.postMessage(1);fire();}
  const refresh=()=>{tree=read();fire();};
  if(ch)ch.onmessage=refresh;
  if(!mem)window.addEventListener('storage',e=>{if(e.key===K)refresh();});
  let bid='';try{bid=localStorage.getItem('oqg2-browser')||'';if(!bid){bid='local-'+newId();localStorage.setItem('oqg2-browser',bid);}}catch(e){bid='local-'+newId();}
  return{
    mode:'local',
    on(path,cb){const s={path,cb,last:undefined};subs.push(s);setTimeout(()=>{s.last=JSON.stringify(getP(tree,path));cb(getP(tree,path));},0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};},
    get(path){return Promise.resolve(clone(getP(tree,path)));},
    set(path,v){tree=read();tree=setP(tree,path,v);commit();return Promise.resolve();},
    update(path,obj){tree=read();for(const k in obj)tree=setP(tree,(path?path+'/':'')+k,obj[k]);commit();return Promise.resolve();},
    remove(path){tree=read();tree=setP(tree,path,null);commit();return Promise.resolve();},
    tx(path,fn){tree=read();const v=fn(clone(getP(tree,path)));if(v!==undefined){tree=setP(tree,path,v);commit();}return Promise.resolve({committed:v!==undefined});},
    now(){return Date.now();},
    uid(){return bid;},
    ensureUser(){return Promise.resolve({uid:bid,isAnonymous:true});}
  };
}
/* memória pura (teste dentro da engine) */
function memoryBackend(){return localBackend('mem',true);}
/* Decide a conexão: com a trava do site principal -> Firebase único "jogos-github";
   sem trava (arquivo aberto do PC, localhost) -> modo local entre abas. */
async function connect(site,opts){
  opts=opts||{};
  if(opts.forceLocal)return localBackend(site);
  const q=new URLSearchParams(location.search);
  if(q.has('local'))return localBackend(site);
  let ok=false;
  if(window.Trava&&window.Trava.ready){
    try{const t=await window.Trava.ready;ok=!!(t&&window.firebase&&firebase.apps&&firebase.apps.length);}catch(e){ok=false;}
  }else if(window.firebase&&window.OQG_FIREBASE&&/^https?:/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname)){
    /* sem trava, mas publicado: usa a config reserva */
    try{if(!firebase.apps.length)firebase.initializeApp(window.OQG_FIREBASE);ok=true;}catch(e){ok=false;}
  }
  if(!ok)return localBackend(site);
  const root=window.DB_ROOT||('sites/'+site);
  return firebaseBackend(root);
}
/* navegador da equipe: avisa a Central quais pastas os jogadores podem gravar */
async function registerWrites(be,site,nodes){
  if(be.mode!=='firebase'||!window.Trava||!window.Trava.admin||!site)return;
  try{
    const ref=be.db.ref('controle/sites/'+site);
    const cur=(await ref.once('value')).val();
    const esc={};nodes.forEach(n=>esc[n]=true);
    if(!cur)await ref.set({open:false,escrita:esc,t:firebase.database.ServerValue.TIMESTAMP});
    else{const miss=nodes.filter(n=>!(cur.escrita&&cur.escrita[n]));for(const n of miss)await ref.child('escrita/'+n).set(true);}
  }catch(e){console.warn('controle',e);}
}

/* ---------- controle da partida ---------- */
function startGame(be,round){
  round=round||0;
  return be.tx('game',g=>({status:'playing',round,phase:'ask',typed:'',revealAt:0,seq:((g&&g.seq)||0)+1}));
}
function toLobby(be){return be.tx('game',g=>({status:'lobby',round:0,phase:'ask',typed:'',revealAt:0,seq:((g&&g.seq)||0)+1}));}
function advance(be,cfg,expect){
  const now=be.now();
  return be.tx('game',g=>{
    if(g===null)return null;
    if(!g||g.status!=='playing')return;
    if(expect&&(g.round!==expect.round||g.phase!==expect.phase))return;
    const st=cfg.steps[g.round];const seq=(g.seq||0)+1;
    if(!st)return Object.assign({},g,{status:'end',seq});
    if(g.phase==='ask')return Object.assign({},g,{phase:'reveal',typed:st.name,revealAt:now,seq});
    if(outcome(cfg,g.round)==='perde'||g.round>=cfg.steps.length-1)return Object.assign({},g,{status:'end',seq});
    return Object.assign({},g,{round:g.round+1,phase:'ask',typed:'',revealAt:0,seq});
  });
}
function redoRound(be){
  return be.tx('game',g=>{if(g===null)return null;if(!g)return;return Object.assign({},g,{status:'playing',phase:'ask',typed:'',revealAt:0,seq:(g.seq||0)+1});});
}

/* ---------- mídias ---------- */
const assetUrl=ref=>{
  if(!ref)return'';const A=window.OQG_ASSETS||{};
  if(typeof ref==='string'&&ref.indexOf('asset:')===0)return A[ref.slice(6)]||'';
  return ref;
};
function readDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file);});}
async function resizeImage(file,max){
  const src=await readDataURL(file);
  return new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let u=c.toDataURL('image/webp',.85);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/png');res(u);};im.src=src;});
}

window.OQG=Object.assign(window.OQG||{},{clone,esc,other,newId,derive,hearts,outcome,heartsCheck,
  connect,localBackend,memoryBackend,registerWrites,startGame,toLobby,advance,redoRound,assetUrl,readDataURL,resizeImage,
  ESCRITA:['players','game','presenca']});
})();
</script>

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.1,type='sine',v=.15,slide=0,delay=0){
  if(!soundOn())return;const a=ac();if(!a)return;const t=a.currentTime+delay;v*=num(cfg.sfxVolume,1);
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(Math.max(.0002,v),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}

function playRef(ref,vol=1){
  if(!soundOn()||!ref)return false;const url=O.assetUrl(ref);if(!url)return false;
  try{const a=new Audio(url);a.volume=Math.max(0,Math.min(1,vol*num(cfg.sfxVolume,1)));a.play().catch(()=>{});return true;}catch(e){return false;}
}
function sfx(name){
  const s=(cfg.sons||{})[name]||{};
  if(s.mudo)return;
  if(s.arq&&playRef(s.arq,num(s.vol,1)))return;
  const p=s.preset||name;if(SY[p])SY[p]();

let music=null,musicRef='';
function fadeOut(a,ms){if(!a)return;const v0=a.volume,t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=v0*(1-k);if(k<1)requestAnimationFrame(f);else a.pause();};f();}
function fadeIn(a,to,ms){const t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=to*k;if(k<1)requestAnimationFrame(f);};f();}
function wantedMusic(){
  if(!soundOn()||PREVIEW||document.body.classList.contains('gameover'))return'';
  if(screen==='lobby'&&cfg.musicaLobby)return cfg.musicaLobby;
  if(screen==='end'&&cfg.musicaFim)return cfg.musicaFim;
  if(screen!=='game')return'';
  for(let i=shownLevel;i>=1;i--){const m=cfg.levels[i-1]&&cfg.levels[i-1].music;if(m)return m;}return'';
}
function updateMusic(){
  const ref=wantedMusic();if(ref===musicRef)return;
  fadeOut(music,1200);music=null;musicRef=ref;if(!ref)return;
  const url=O.assetUrl(ref);if(!url)return;
  const a=new Audio(url);a.loop=true;a.volume=0;music=a;
  a.play().then(()=>fadeIn(a,num(cfg.musicVolume,.5),1500)).catch(()=>{pendingMusic=a;if(!SPECT)$('soundTip').style.display='block';});
}
function unlock(){
  ac();$('soundTip').style.display='none';

const cv=$('fx'),cx=cv.getContext('2d');let W=0,H=0,parts=[],PT=null;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);}

function bgCss(b){
  b=b||{};const c1=b.c1||'#5fdcf7',c2=b.c2||'#c9f4ff',c3=b.c3||c2;
  if(b.tipo==='cor')return c1;
  if(b.tipo==='linear')return`linear-gradient(${num(b.ang,180)}deg,${c1},${c2},${c3})`;
  if(b.tipo==='imagem'){const u=O.assetUrl(b.img);return u?`${b.escurecer?`linear-gradient(rgba(0,0,0,${num(b.escurecer,0)}),rgba(0,0,0,${num(b.escurecer,0)})),`:''}url("${u}") center/cover no-repeat, ${c1}`:c1;}
  return`radial-gradient(ellipse at 50% ${num(b.pos,45)}%,${c1},${c2} ${num(b.meio,55)}%,${c3})`;
}
function buildLevels(){

function curLv(){return(cfg.levels||[])[Math.max(0,shownLevel-1)]||{};}
function spawn(init){
  const p={},pt=PT||{},t=pt.tipo;const cores=String(pt.cores||'').split(/[,\s]+/).filter(Boolean);
  const vel=num(pt.vel,1);
  if(t==='hex'){p.k='hex';p.x=rnd(0,W);p.y=init?rnd(0,H):H+40;p.s=rnd(10,30)*num(pt.tam,1);p.vy=-rnd(.15,.45)*vel;p.r=rnd(0,6);p.vr=rnd(-.004,.004);p.a=rnd(.12,.3);p.c=cores.length?pick(cores):'#ffffff';}
  else if(t==='brasas'){p.k='ember';p.x=rnd(0,W);p.y=init?rnd(0,H):H+10;p.s=rnd(1.5,4)*num(pt.tam,1);p.vy=-rnd(.6,2.6)*vel;p.ph=rnd(0,6);p.c=cores.length?pick(cores):pick(['#ffd24a','#ff7b2e','#ff3d2e','#fff1a8']);}
  else if(t==='emoji'){p.k='emo';p.x=rnd(0,W);p.y=init?rnd(0,H):H+40;p.s=rnd(18,40)*num(pt.tam,1);p.vy=-rnd(.3,1)*vel;p.ph=rnd(0,6);p.r=rnd(-.4,.4);p.e=pick(splitE(pt.emojis).length?splitE(pt.emojis):['✨']);p.a=rnd(.5,.9);p.c=cores.length?pick(cores):'#ffffff';}
  else if(t==='neve'){p.k='snow';p.x=rnd(0,W);p.y=init?rnd(0,H):-10;p.s=rnd(1.5,4.5)*num(pt.tam,1);p.vy=rnd(.4,1.4)*vel;p.ph=rnd(0,6);p.c=cores.length?pick(cores):'#ffffff';}
  else{p.k='star';p.ang=rnd(0,Math.PI*2);p.d=init?rnd(5,Math.max(W,H)*.7):rnd(2,40);p.v=rnd(.4,1.4)*vel;p.s=rnd(.6,2)*num(pt.tam,1);
    p.c=cores.length?pick(cores):pick(['#ffffff','#cdb6ff','#8fd0ff']);}
  return p;
}
function setFx(pt){PT=pt||{};parts=[];if(!PT.tipo||PT.tipo==='nenhuma')return;const n=Math.round(num(PT.qtd,40)*(RM?.25:1));for(let i=0;i<n;i++)parts.push(spawn(true));}
const EMOJIF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace';
function hexPath(x,y,s,r){cx.beginPath();for(let i=0;i<6;i++){const a=r+i*Math.PI/3;cx.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);}cx.closePath();}
function loop(){
  cx.clearRect(0,0,W,H);const cxm=W/2,cym=H*.48;
  for(let i=0;i<parts.length;i++){let p=parts[i];
    if(p.k==='hex'){p.y+=p.vy;p.r+=p.vr;if(p.y<-40)p=parts[i]=spawn(false);cx.strokeStyle=p.c;cx.globalAlpha=p.a;cx.lineWidth=3;hexPath(p.x,p.y,p.s,p.r);cx.stroke();cx.globalAlpha=1;}
    else if(p.k==='ember'){p.y+=p.vy;p.ph+=.05;p.x+=Math.sin(p.ph)*.6;if(p.y<-10)p=parts[i]=spawn(false);cx.fillStyle=p.c;cx.globalAlpha=.85;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.globalAlpha=1;}
    else if(p.k==='snow'){p.y+=p.vy;p.ph+=.03;p.x+=Math.sin(p.ph)*.5;if(p.y>H+10)p=parts[i]=spawn(false);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.globalAlpha=1;}
    else if(p.k==='emo'){p.y+=p.vy;p.ph+=.03;p.x+=Math.sin(p.ph)*.5;if(p.y<-50)p=parts[i]=spawn(false);cx.globalAlpha=p.a;cx.font=`${p.s}px ${EMOJIF}`;cx.textAlign='center';cx.fillStyle=p.c||'#fff';cx.fillText(p.e,p.x,p.y);cx.globalAlpha=1;}
    else{const d0=p.d;p.v*=1.012;p.d+=p.v;const x0=cxm+Math.cos(p.ang)*d0,y0=cym+Math.sin(p.ang)*d0,x1=cxm+Math.cos(p.ang)*p.d,y1=cym+Math.sin(p.ang)*p.d;
      if(x1<-20||x1>W+20||y1<-20||y1>H+20){parts[i]=spawn(false);continue;}
      cx.strokeStyle=p.c;cx.globalAlpha=Math.min(1,p.d/120);cx.lineWidth=p.s;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();cx.globalAlpha=1;}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const nz=(v,d)=>v===''||v==null?d:num(v,d);

function trackFrames(kfs){
  const ks=kfs.slice().sort((a,b)=>a.t-b.t);const t0=ks[0].t,tN=ks[ks.length-1].t,dur=Math.max(1,tN-t0);
  const hasF=ks.some(k=>k.f);const firstF=(ks.find(k=>k.f)||{}).f||'none';let lf=firstF,lo=1;
  const frames=ks.map(k=>{if(k.o!=null&&k.o!=='')lo=nz(k.o,1);if(k.f)lf=k.f;const f={transform:kfT(k),opacity:lo,offset:tN>t0?(k.t-t0)/dur:0,easing:k.e||'linear'};if(hasF)f.filter=lf;return f;});

  return{frames,t0,dur};

function animDur(an){let m=0;['att','def'].forEach(tr=>((an.tracks||{})[tr]||[]).forEach(k=>{if(k.t>m)m=k.t;}));return m;}
let animTimers=[];

function playAnim(an,opt){
  opt=opt||{};const sp=SPD()*num(opt.vel,1);const ents={att,def};const list=[];
  stopAnim();const ctx={timers:animTimers};

    const kfs=(an.tracks||{})[tr];if(!kfs||!kfs.length)return;
    const{frames,t0,dur}=trackFrames(kfs);const el=ents[tr];
    el.getAnimations().forEach(a=>a.cancel());
    try{list.push(el.animate(frames,{duration:dur/sp,delay:t0/sp,fill:'both'}));}catch(e){console.warn('animação inválida',e);}
  });
  if(opt.seek!=null){list.forEach(a=>{a.pause();a.currentTime=opt.seek/sp;});return Promise.resolve(list);}
  const SP0=SPD;
  (an.events||[]).forEach(ev=>{animTimers.push(setTimeout(()=>runEvent(ev,ctx),num(ev.t,0)/sp));});
  void SP0;
  return sleep(animDur(an)/sp).then(()=>list);
}

  sfx('perda');flash(1);shake(18);
  lc.animate([{transform:'none'},{transform:'translateX(-8px) rotate(-4deg)',offset:.1},{transform:'translateX(8px) rotate(4deg)',offset:.2},{transform:'translateX(-6px)',offset:.3},{transform:'translateY(0) rotate(0)',filter:'grayscale(1)',offset:.45},{transform:'translateY(1200px) rotate(35deg)',filter:'grayscale(1)'}],{duration:2200,delay:500,easing:'ease-in',fill:'forwards'});
  gt.animate([{opacity:0,transform:'translateY(-600px) rotate(-8deg)'},{opacity:1,transform:'translateY(0) rotate(3deg)',offset:.6},{opacity:1,transform:'translateY(-14px) rotate(-2deg)',offset:.8},{opacity:1,transform:'none'}],{duration:1100,delay:700,easing:'ease-out',fill:'forwards'});
  setTimeout(()=>{SY.boom();shake(12);},1350);
}
function renderEnd(){
  if(!G)return;
  const r=Math.max(0,Math.min(G.round||0,cfg.steps.length-1));const last=cfg.steps[r];
  const dv=O.derive(cfg,r+1);
  let winner=null,loser=null;
  if(last&&O.outcome(cfg,r)==='perde'){loser=last.player;winner=O.other(loser);}else if(last){winner=last.player;loser=O.other(winner);}
  const wn=winner?pName(winner):'',ln=loser?pName(loser):'';
  setLevel(last?last.level:1,false);
  $('eTitle').textContent=cfg.endTitle||'';
  $('eText').innerHTML=fill(cfg.endText,{vencedor:wn,perdedor:ln,final:dv.cur.name,n:String(dv.streak)});
  if(winner)paintPhoto($('eWin').querySelector('.ph-in'),winner);
  $('eWinName').textContent=wn?'🏆 '+wn:'';$('eWinName').style.display=wn?'':'none';
  $('eLose').innerHTML=loser?`<div class="hexph"><div class="ph-in"></div></div><span>💀 ${esc(ln)}</span>`:'';
  if(loser)paintPhoto($('eLose').querySelector('.ph-in'),loser);
  renderChain($('eChain'),dv.chain);
}

/* ---------------- digitação ---------------- */
function target(){return (G&&cfg.steps[G.round]&&cfg.steps[G.round].name)||'';}
const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const freeMode=()=>(AJ.typingMode||cfg.typingMode)==='livre';
inp.addEventListener('input',()=>{
  if(!myTurn()||PREVIEW){inp.value=(G&&G.typed)||'';return;}
  const before=typed;
  if(freeMode()){typed=inp.value.slice(0,40);}
  else{
    const t=[...target()],v=[...inp.value];let n=[...typed].length;
    if(v.length>n)n=Math.min(t.length,v.length);else if(v.length<n)n=Math.max(0,v.length);
    typed=t.slice(0,n).join('');inp.value=typed;
    try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){}
  }
  if(typed!==before){if(typed.length>before.length)sfx('tecla');be.update('game',{typed}).catch(()=>{});}
});
function submit(){
  if(!myTurn()||PREVIEW)return;
  const ok=freeMode()?norm(typed)===norm(target()):typed===target();
  if(!ok){inp.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250});return;}
  O.advance(be,cfg,{round:G.round,phase:'ask'});
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
$('sendBtn').addEventListener('click',e=>{e.currentTarget.blur();submit();});
function nextClick(){if(resultShown&&G&&G.status==='playing'&&!PREVIEW)O.advance(be,cfg,{round:G.round,phase:'reveal'});}
$('nextBtn').addEventListener('click',e=>{e.currentTarget.blur();nextClick();});
arena.addEventListener('click',()=>{if(editOn)return;if(myTurn())inp.focus();else if(mySlot()&&!SPECT)nextClick();});
document.addEventListener('keydown',e=>{
  if(screen!=='game'||e.target===inp||PREVIEW)return;
  if(e.target.closest&&e.target.closest('input,textarea,button,select'))return;
  if((e.key===' '||e.key==='Enter')&&resultShown&&mySlot()&&!SPECT){e.preventDefault();nextClick();}
  else if(myTurn()&&e.key.length===1){inp.focus();}
});
$('soundTip').onclick=unlock;

/* =====================================================================
   EDIÇÃO (só dentro da engine): arrastar/redimensionar caixas
   ===================================================================== */
let editOn=false,editSel='';
const NOMES={ltitle:'Título',lsub:'Subtítulo',slots:'Vagas',lbuttons:'Botões',lhint:'Dica',p1:'Jogador 1',p2:'Jogador 2',counter:'Contador',level:'Fase',
  verdict:'Pergunta / veredito',sub:'Texto de baixo',arena:'Arena',pass:'Aviso "passou a vez"',answer:'Caixa de resposta',send:'Botão Enviar',chain:'Corrente',next:'Botão Próximo',
  ewin:'Vencedor',etitle:'Título final',etext:'Texto final',elose:'Perdedor',echain:'Corrente final',lvintro:'Aviso de fase',gotext:'Texto de derrota'};
function drawEdit(){
  const lay=$('editLayer');lay.innerHTML='';
  const cam=cfg.camera||{};
  if(cam.mostrar!==false&&cam.w){const c=document.createElement('div');c.className='cam';Object.assign(c.style,{left:cam.x+'px',top:cam.y+'px',width:cam.w+'px',height:cam.h+'px'});c.innerHTML='<span>📷 espaço da câmera (não aparece no jogo)</span>';lay.appendChild(c);}
  const scr=document.querySelector('.screen.on');
  const ids=[...scr.querySelectorAll('[data-l]')].map(e=>e.dataset.l).concat(screen==='game'?['lvintro','gotext']:[]);
  ids.sort((a,b)=>{const A=(cfg.layout||{})[a]||{},B=(cfg.layout||{})[b]||{};return(B.w*B.h)-(A.w*A.h);});
  ids.forEach(id=>{
    const b=(cfg.layout||{})[id];if(!b)return;
    const d=document.createElement('div');d.className='eb'+(id===editSel?' sel':'')+(b.vis===false?' off':'');d.dataset.id=id;
    Object.assign(d.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});
    d.innerHTML=`<span class="lb">${esc(NOMES[id]||id)}</span><span class="rz"></span>`;
    lay.appendChild(d);
  });
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(!editOn)return;const eb=e.target.closest('.eb');if(!eb)return;
  e.preventDefault();const id=eb.dataset.id,b=Object.assign({},cfg.layout[id]);
  editSel=id;parent.postMessage({t:'sel',id},'*');
  drag={id,b,x0:e.clientX,y0:e.clientY,rz:e.target.classList.contains('rz'),el:eb};
  document.querySelectorAll('.eb').forEach(x=>x.classList.toggle('sel',x===eb));
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=(e.clientX-drag.x0)/SCALE,dy=(e.clientY-drag.y0)/SCALE;const g=e.shiftKey?1:10,sn=v=>Math.round(v/g)*g;
  const nb=Object.assign({},drag.b);
  if(drag.rz){nb.w=Math.max(20,sn(drag.b.w+dx));nb.h=Math.max(16,sn(drag.b.h+dy));}else{nb.x=sn(drag.b.x+dx);nb.y=sn(drag.b.y+dy);}
  cfg.layout[drag.id]=nb;drag.nb=nb;applyLayoutOne(drag.id);
  Object.assign(drag.el.style,{left:nb.x+'px',top:nb.y+'px',width:nb.w+'px',height:nb.h+'px'});
});
document.addEventListener('pointerup',()=>{if(!drag)return;if(drag.nb)parent.postMessage({t:'layout',id:drag.id,box:drag.nb},'*');drag=null;});
function applyLayoutOne(id){const el=document.querySelector(`[data-l="${id}"]`);const b=cfg.layout[id];if(!el||!b)return;
  el.style.left=b.x+'px';el.style.top=b.y+'px';el.style.width=b.w+'px';el.style.height=b.h+'px';el.style.setProperty('--h',b.h+'px');}

/* =====================================================================
   PRÉVIA (engine): a engine manda a config e o que mostrar
   ===================================================================== */
let VIEW=null,kfDrag=null,animEdit=null;
function fakePlayers(){P={};['p1','p2'].forEach(s=>{P[s]={name:cfg.players[s].name};});}
async function previewView(v){
  VIEW=v;animEdit=null;att.classList.remove('kfdrag');def.classList.remove('kfdrag');
  fakePlayers();cfgReady=true;lastKey='';renderPlayers();
  if(v.tela==='lobby'){G={status:'lobby',round:0,phase:'ask',seq:Date.now()};renderState();}
  else if(v.tela==='fim'){const r=Math.min(cfg.steps.length-1,num(v.round,cfg.steps.length-1));G={status:'end',round:r,phase:'reveal',seq:Date.now()};renderState();}
  else if(v.tela==='anim'){
    const r=Math.max(0,Math.min(cfg.steps.length-1,num(v.round,0)));G={status:'playing',round:r,phase:'ask',seq:Date.now()};renderState();
    const step=cfg.steps[r];const{cur}=O.derive(cfg,r);
    $('verdict').innerHTML=question(cur);$('sub').textContent='';
    setEnt(def,cur);setEnt(att,step);att.style.opacity=1;
    animEdit=v;
    if(v.play){const an=v.anim;const t0=performance.now();const sp=SPD()*num(v.vel,1);const dur=animDur(an)/sp;
      const tick=()=>{if(animEdit!==v)return;const e=(performance.now()-t0);parent.postMessage({t:'animT',t:Math.min(e*sp,animDur(an))},'*');if(e<dur+50)requestAnimationFrame(tick);};
      requestAnimationFrame(tick);
      await playAnim(an,{vel:v.vel});if(animEdit!==v)return;
      if(v.final){const win=v.res!=='erra';const fim=an.fim||(win?'centro':'ficar');if(fim==='centro')await toChamp(win?att:def);}
      parent.postMessage({t:'animEnd'},'*');
    }else{
      await playAnim(v.anim,{seek:num(v.at,0)});
      if(v.sel){const el=v.sel.track==='def'?def:att;el.classList.add('kfdrag');}
    }
  }else{
    const r=Math.max(0,Math.min(cfg.steps.length-1,num(v.round,0)));
    if(v.fase==='play'){G={status:'playing',round:r,phase:'ask',seq:Date.now()};renderState();await sleep(400);
      G={status:'playing',round:r,phase:'reveal',seq:Date.now()+1,revealAt:Date.now()};lastKey='';renderState();}
    else if(v.fase==='result'){G={status:'playing',round:r,phase:'reveal',seq:Date.now(),instant:true};renderState();}
    else{G={status:'playing',round:r,phase:'ask',seq:Date.now(),typed:v.typed?cfg.steps[r].name.slice(0,Math.ceil(cfg.steps[r].name.length/2)):''};renderState();inp.value=G.typed;}
  }
}
/* arrastar o item no keyframe selecionado */
document.addEventListener('pointerdown',e=>{
  if(!PREVIEW||!animEdit||!animEdit.sel)return;const el=e.target.closest('.kfdrag');if(!el)return;
  e.preventDefault();const k=animEdit.sel.kf||{};kfDrag={x0:e.clientX,y0:e.clientY,kx:num(k.x,0),ky:num(k.y,0),el};
});
document.addEventListener('pointermove',e=>{
  if(!kfDrag)return;const dx=(e.clientX-kfDrag.x0)/SCALE,dy=(e.clientY-kfDrag.y0)/SCALE;
  kfDrag.nx=Math.round(kfDrag.kx+dx);kfDrag.ny=Math.round(kfDrag.ky+dy);
  kfDrag.el.getAnimations().forEach(a=>a.cancel());const k=Object.assign({},animEdit.sel.kf,{x:kfDrag.nx,y:kfDrag.ny});
  kfDrag.el.style.transform=kfT(k);kfDrag.el.style.opacity=nz(k.o,1);
});
document.addEventListener('pointerup',()=>{if(!kfDrag)return;if(kfDrag.nx!=null)parent.postMessage({t:'kf',track:animEdit.sel.track,i:animEdit.sel.i,x:kfDrag.nx,y:kfDrag.ny},'*');kfDrag=null;});

function setCfg(c,assets){
  cfg=c;if(assets)window.OQG_ASSETS=assets;
  applyAll();
}
if(PREVIEW){
  window.addEventListener('message',e=>{
    const m=e.data||{};
    if(m.t==='cfg'){setCfg(m.cfg,m.assets);if(VIEW&&!m.semRedesenho&&VIEW.tela!=='anim')previewView(VIEW);}
    else if(m.t==='view'){previewView(m.v);}
    else if(m.t==='edit'){editOn=!!m.on;editSel=m.sel||'';document.body.classList.toggle('editando',editOn);if(editOn)drawEdit();}
    else if(m.t==='mute'){cfg.sound=!m.on;}
    else if(m.t==='som'){unlock();if(m.arq){if(!playRef(m.arq,num(m.vol,1))&&SY[m.preset])SY[m.preset]();}else if(SY[m.preset])SY[m.preset]();}
    else if(m.t==='stop'){animEdit=null;stopAnim();}
  });
  document.body.classList.add('preview');
  cfgReady=true;applyAll();fakePlayers();
  parent.postMessage({t:'ready'},'*');
  return;
}

/* =====================================================================
   CONEXÃO
   ===================================================================== */
(async function start(){
  applyAll();cfgReady=true;
  try{tabId=sessionStorage.getItem('oqg2-tab')||'';if(!tabId){tabId=O.newId();sessionStorage.setItem('oqg2-tab',tabId);}mySlotV=sessionStorage.getItem('oqg2-slot')||null;}catch(e){tabId=O.newId();}
  if(SPECT)mySlotV=null;
  if(TESTE){
    be=O.memoryBackend();await be.ensureUser();myUid='teste';myId='teste';
    await be.set('players',{p1:{name:cfg.players.p1.name,client:'teste',seen:Date.now()},p2:{name:cfg.players.p2.name,client:'teste',seen:Date.now()}});
    mySlotV='p1';
  }else{
    be=await O.connect(SITE);
    await be.ensureUser();myUid=be.uid();myId=myUid+'_'+tabId;
    if(be.mode==='local'&&!SPECT){const b=$('modeBadge');b.hidden=false;b.textContent='Modo teste local: abra outra aba para o 2º jogador e ADM/ para o painel';}
    O.registerWrites(be,SITE,O.ESCRITA);
  }
  be.on('players',p=>{P=p||{};P._loaded=true;renderPlayers();});
  be.on('game',g=>{G=g||{status:'lobby',round:0,phase:'ask',seq:0};renderState();});
  if(TESTE)return;
  be.on('ajustes',a=>{AJ=a||{};renderPlayers();});
  be.on('banidos',b=>{BAN=b||{};const ban=!!BAN[myUid];$('banned').classList.toggle('on',ban);if(ban&&mySlotV)leave();});
  let rbase;be.on('control/reload',v=>{if(rbase===undefined){rbase=v;return;}if(v!==rbase)location.reload();});
  setInterval(()=>renderPlayers(),5000);
  setInterval(()=>{if(mySlotV)be.update('players/'+mySlotV,{seen:be.now()}).catch(()=>{});presence();},8000);
  presence();
  if(be.mode==='firebase'){try{be.db.ref(be.root+'/presenca/'+presenceKey()).onDisconnect().remove();}catch(e){}}
  addEventListener('pagehide',()=>{try{be.remove('presenca/'+presenceKey());}catch(e){}});
})();
})();
