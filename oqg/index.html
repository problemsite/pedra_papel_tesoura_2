<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O que ganha de...?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e2a47;--card:#ffffff;--edge:#0e2a47;--accent:#1f6bff;--good:#15b863;--bad:#f0344a;--miss:#ff8a1f;--gold:#ffe14d;
  --txt:#0e2a47;--sb:rgba(14,42,71,.35);
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --hex:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-lv="2"]{--txt:#3a1300}
body[data-lv="3"],body[data-lv="4"]{--txt:#ffffff;--sb:rgba(255,255,255,.45)}
body[data-lv="5"]{--txt:#3a1d00}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;font-family:"Nunito",system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#c9f4ff}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- fundo épico por nível ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:filter 1.2s}
.bgl{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.l1{background:radial-gradient(ellipse at 50% 45%,#5fdcf7,#c9f4ff 75%)}
.l2{background:radial-gradient(ellipse at 50% 65%,#ffe07a,#ff9d3c 55%,#e0561f)}
.l3{background:radial-gradient(ellipse at 50% 65%,#ff6a3d,#a8132b 55%,#2a0310)}
.l4{background:radial-gradient(ellipse at 28% 30%,rgba(140,60,255,.55),transparent 45%),radial-gradient(ellipse at 75% 72%,rgba(31,107,255,.5),transparent 45%),#07001a}
.l5{background:radial-gradient(ellipse at 50% 38%,#fffbe3,#ffd54a 38%,#c07a00 75%,#4a2500)}
body[data-lv="1"] .l1,body[data-lv="2"] .l2,body[data-lv="3"] .l3,body[data-lv="4"] .l4,body[data-lv="5"] .l5{opacity:1}
.rays{position:absolute;left:50%;top:42%;width:230vmax;height:230vmax;transform:translate(-50%,-50%);opacity:0;transition:opacity 2s;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.34) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 50s linear infinite}
.rays{visibility:hidden;animation-play-state:paused}
body[data-lv="5"] .rays{opacity:1;visibility:visible;animation-play-state:running}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hexmark{position:absolute;left:50%;top:52%;width:min(66vmin,540px);aspect-ratio:1;transform:translate(-50%,-50%);clip-path:var(--hex);background:rgba(255,255,255,.28);transition:background 1.5s}
body[data-lv="4"] .hexmark{background:rgba(160,120,255,.10)}
body[data-lv="3"] .hexmark{background:rgba(255,200,150,.12)}
#fx{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;opacity:0;transition:opacity 1.5s;box-shadow:inset 0 0 18vmin rgba(0,0,0,.7)}
body[data-lv="3"] .vig,body[data-lv="4"] .vig{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
body.gameover #bg,body.gameover .arena{filter:grayscale(1) brightness(.6)}

/* ---------- geral ---------- */
.screen{display:none;position:relative;z-index:1;height:100%}
.screen.on{display:flex}
.btn{font-family:var(--display);font-size:clamp(17px,2.2vw,24px);background:var(--accent);color:#fff;border:3px solid var(--edge);border-radius:18px;
  box-shadow:0 5px 0 var(--edge);padding:.42em 1.05em;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink)}
.bigtitle{font-family:var(--display);font-size:clamp(42px,8.5vw,104px);line-height:.95;margin:0;color:#fff;-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;text-shadow:0 7px 0 var(--edge);text-align:center}
.subtitle{font-weight:800;font-size:clamp(15px,2.2vw,22px);color:var(--txt);margin:0;max-width:40ch;text-align:center}
.hint{font-weight:800;font-size:13px;color:var(--txt);opacity:.8;text-align:center}
.hexph{width:56px;height:56px;flex:none;background:var(--edge);clip-path:var(--hex);display:grid;place-items:center}
.ph-in{width:calc(100% - 7px);height:calc(100% - 7px);clip-path:var(--hex);background:#fff center/cover no-repeat;display:grid;place-items:center;
  font-family:var(--display);font-size:calc(1em + 10px);color:var(--edge)}
.mine .hexph,.mine .pname,.slot .hexph,.slot .pname{cursor:pointer}
.mine .hexph:hover{filter:brightness(1.1)}
.nameinput{font-family:var(--display);font-size:20px;width:150px;border:2px solid var(--edge);border-radius:8px;padding:0 6px;color:var(--ink)}

/* ---------- lobby ---------- */
#lobby{flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.slots{display:flex;gap:clamp(12px,4vw,40px);flex-wrap:wrap;justify-content:center}
.slot{background:var(--card);border:3px solid var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--edge);padding:18px 16px;width:min(250px,42vw);display:flex;flex-direction:column;align-items:center;gap:10px}
.slot .hexph{width:112px;height:112px;font-size:34px}
.slot .pname{font-family:var(--display);font-size:24px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .state{font-weight:800;font-size:13px;color:#4a6a82}
.slot.mine{box-shadow:0 0 0 4px var(--gold),0 6px 0 var(--edge)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-weight:800;font-size:12px;background:var(--gold);border:2px solid var(--edge);border-radius:999px;padding:3px 12px;z-index:30}

/* ---------- jogo ---------- */
#game{flex-direction:column}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:24px 16px 0;position:relative;z-index:6}
.pcard{justify-self:start;transform-origin:left center;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:5px 16px 5px 5px;
  box-shadow:0 4px 0 var(--edge);position:relative;transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .35s;max-width:100%}
.pcard.right{justify-self:end;transform-origin:right center;flex-direction:row-reverse;padding:5px 5px 5px 16px}
.pinfo{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.pcard.right .pinfo{align-items:flex-end}
.hearts{font-family:var(--emoji);font-size:clamp(13px,1.6vw,17px);letter-spacing:1px;white-space:nowrap}
.hearts:empty{display:none}
.hearts .lost{filter:grayscale(1);opacity:.35}
.brokeheart{position:fixed;left:0;top:0;font-family:var(--emoji);font-size:44px;z-index:30;pointer-events:none}
.pcard .pname{font-family:var(--display);font-size:clamp(15px,2vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pcard.active{transform:scale(1.12);box-shadow:0 0 0 4px var(--gold),0 4px 0 var(--edge),0 0 34px var(--gold)}
.pcard .ptag{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);background:var(--gold);border:2px solid var(--edge);font-family:var(--display);font-size:13px;padding:0 9px;border-radius:8px;opacity:0;transition:opacity .3s;white-space:nowrap}
.pcard.active .ptag{opacity:1}
.pcard.off{opacity:.55}
.pcard.crowned::before{content:"👑";font-family:var(--emoji);position:absolute;top:-26px;left:12px;font-size:30px;animation:bob 2s ease-in-out infinite}
.pcard.right.crowned::before{left:auto;right:10px}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{font-family:var(--display);font-size:clamp(14px,1.8vw,19px);background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:.1em .8em;box-shadow:0 3px 0 var(--edge);white-space:nowrap}
.lvpill{background:var(--gold)}
.banner{min-height:clamp(92px,18vh,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 16px 0;position:relative;z-index:6}
#verdict{font-family:var(--display);font-size:clamp(26px,5.6vw,68px);line-height:1.03;color:#fff;-webkit-text-stroke:3px var(--edge);paint-order:stroke fill;text-shadow:0 5px 0 var(--edge);max-width:22ch}
#verdict .it{color:var(--gold)}
body[data-lv="5"] #verdict .it{color:#1f6bff}
#verdict.win{color:var(--good)} #verdict.miss{color:var(--miss)} #verdict.lose{color:var(--bad)}
#sub{font-weight:900;color:var(--txt);font-size:clamp(14px,2vw,21px);margin-top:8px;min-height:1.4em;max-width:46ch}
.arena{flex:1;position:relative;overflow:hidden;min-height:170px;--sz:clamp(80px,min(19vw,25vh),200px);transition:filter 1.2s}
.ent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;will-change:transform}
#def{z-index:2}#att{z-index:3;opacity:0}
.vis{width:var(--sz);height:var(--sz);display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--sz)*.8);line-height:1;filter:drop-shadow(0 7px 0 rgba(14,42,71,.28))}
.vis img{width:100%;height:100%;object-fit:contain;padding:5%}
.ent .name{position:relative;z-index:1;font-family:var(--display);font-size:calc(var(--sz)*.13 + 8px);background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:.05em .7em;white-space:nowrap;box-shadow:0 4px 0 var(--edge)}
.champ .vis{animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 0 22px #fff) drop-shadow(0 7px 0 rgba(14,42,71,.28))}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.06)}}
.part{position:absolute;left:50%;top:50%;pointer-events:none;font-family:var(--emoji);z-index:4;line-height:1}
.beam{position:absolute;top:50%;height:18px;margin-top:-9px;border-radius:9px;background:linear-gradient(90deg,#fff,#5fdcf7,#fff);box-shadow:0 0 26px #5fdcf7;transform-origin:left center;z-index:1;pointer-events:none}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:8px solid rgba(255,214,110,.9);box-shadow:0 0 30px rgba(255,190,60,.8),inset 0 0 20px rgba(255,190,60,.6);pointer-events:none;z-index:1}
.flash{position:absolute;inset:-20%;background:radial-gradient(circle,#fff 25%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;z-index:5}
.passban{position:absolute;left:50%;top:3%;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--card);border:3px solid var(--edge);border-radius:999px;
  padding:6px 20px 6px 6px;box-shadow:0 5px 0 var(--edge);font-family:var(--display);font-size:clamp(17px,2.4vw,26px);z-index:6;white-space:nowrap}
.answer{display:flex;gap:10px;max-width:680px;width:calc(100% - 32px);margin:0 auto 10px;position:relative;z-index:6}
#inp{flex:1;min-width:0;background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:18px;padding:.4em .9em;font:inherit;font-weight:900;font-size:clamp(18px,2.5vw,27px);box-shadow:0 5px 0 var(--edge);caret-color:var(--accent)}
#inp::placeholder{color:#6b879b;font-weight:800}
#inp.myturn{box-shadow:0 0 0 4px var(--gold),0 5px 0 var(--edge)}
.bottom{display:flex;align-items:center;gap:12px;padding:6px 16px 16px;position:relative;z-index:6}
.chain{display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;padding:6px 4px 10px;scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
.chain::-webkit-scrollbar{height:6px}
.chain::-webkit-scrollbar-track{background:transparent}
.chain::-webkit-scrollbar-thumb{background:var(--sb);border-radius:6px}
.chain.over{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px);mask-image:linear-gradient(90deg,transparent 0,#000 36px)}
.chain .c.last{box-shadow:0 0 0 3px var(--gold);}
.chain .c{flex:none;width:40px;height:40px;display:grid;place-items:center;font-family:var(--emoji);font-size:23px;background:var(--card);border:2px solid var(--edge);border-radius:12px;position:relative}
.chain .c img{width:30px;height:30px;object-fit:contain}
.chain .c.erra{background:#ffd9b0;opacity:.75}
.chain .c.erra::after,.chain .c.perde::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-family:var(--display);font-size:30px}
.chain .c.perde{background:#ffc2c9}
.chain .sep{flex:none;font-weight:900;color:var(--txt);opacity:.6}
.nochain .chain{visibility:hidden}.nocount #counter{visibility:hidden}
#nextBtn{visibility:hidden}
#nextBtn.show{visibility:visible}
.overlay{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20;text-align:center;padding:20px}
.bigword{font-family:var(--display);font-size:clamp(40px,9vw,120px);line-height:1;color:#fff;-webkit-text-stroke:4px var(--edge);paint-order:stroke fill;text-shadow:0 8px 0 var(--edge),0 0 40px rgba(255,255,255,.6);opacity:0}
.bigword.red{color:var(--bad)}

/* ---------- fim ---------- */
#end{flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.winner{position:relative}
.winner .hexph{width:150px;height:150px;font-size:48px;margin:0 auto}
.wname{display:inline-block;margin-top:8px;font-size:22px}
.winner .crown{position:absolute;top:-56px;left:0;right:0;text-align:center;font-family:var(--emoji);font-size:60px;animation:bob 2s ease-in-out infinite}
.loserbox{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--txt)}
.loserbox .hexph{filter:grayscale(1);width:52px;height:52px}
#end .chain{max-height:30vh;overflow-y:auto;justify-content:center;flex-wrap:wrap;max-width:760px;flex:none}
.soundtip{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;display:none}
@media (max-width:620px){.topbar{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;grid-row:2;flex-direction:row;justify-content:center}.pcard .hexph{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){.champ .vis,.rays,.vig,.pcard.crowned::before,.winner .crown{animation:none}}
</style>
</head>
<body data-lv="1">
<div id="bg">
  <div class="bgl l1"></div><div class="bgl l2"></div><div class="bgl l3"></div><div class="bgl l4"></div><div class="bgl l5"></div>
  <div class="rays"></div><div class="hexmark"></div><canvas id="fx"></canvas><div class="vig"></div>
</div>

<!-- LOBBY -->
<section class="screen on" id="lobby">
  <h1 class="bigtitle" id="lTitle">O que ganha de...?</h1>
  <p class="subtitle" id="lSub"></p>
  <div class="slots" id="slots"></div>
  <div class="row">
    <button class="btn" id="lStart" disabled>Começar</button>
    <button class="btn ghost" id="lLeave" hidden>Sair da vaga</button>
  </div>
  <p class="hint" id="lHint">Escolha sua vaga. Clique na sua foto ou no seu nome para trocar.</p>
</section>

<!-- JOGO -->
<section class="screen" id="game">
  <div class="topbar">
    <div class="pcard" id="c-p1" data-slot="p1"><div class="hexph"><div class="ph-in"></div></div><div class="pinfo"><span class="pname"></span><span class="hearts"></span></div><span class="ptag">VEZ</span></div>
    <div class="mid"><span class="pill" id="counter"></span><span class="pill lvpill" id="lvpill"></span></div>
    <div class="pcard right" id="c-p2" data-slot="p2"><div class="hexph"><div class="ph-in"></div></div><div class="pinfo"><span class="pname"></span><span class="hearts"></span></div><span class="ptag">VEZ</span></div>
  </div>
  <div class="banner"><div id="verdict"></div><div id="sub"></div></div>
  <div class="arena" id="arena">
    <div class="ent" id="def"><div class="vis"></div><div class="name"></div></div>
    <div class="ent" id="att"><div class="vis"></div><div class="name"></div></div>
    <div class="passban" id="passban"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="answer">
    <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Resposta">
    <button class="btn" id="sendBtn">Enviar</button>
  </div>
  <div class="bottom"><div class="chain" id="chain"></div><button class="btn" id="nextBtn">Próximo</button></div>
</section>

<!-- FIM -->
<section class="screen" id="end">
  <div class="winner"><div class="crown">👑</div><div class="hexph" id="eWin"><div class="ph-in"></div></div><div class="pill wname" id="eWinName"></div></div>
  <h1 class="bigtitle" id="eTitle"></h1>
  <p class="subtitle" id="eText"></p>
  <div class="loserbox" id="eLose"></div>
  <div class="chain" id="eChain"></div>
</section>

<div class="overlay"><div class="bigword" id="lvIntro"></div></div>
<div class="overlay"><div class="bigword red" id="goText"></div></div>
<button class="btn small ghost soundtip" id="soundTip">🔊 Clique para ativar o som</button>
<div class="badge" id="modeBadge" hidden></div>
<input type="file" id="photoFile" accept="image/*" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=9"></script>
<script src="comum.js?v=9"></script>
<script>
(function(){
'use strict';
const O=window.OQG,M=O.media,esc=O.esc;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const T=(x=0,y=0,sx=1,sy=sx,r=0)=>`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${r}deg) scale(${sx},${sy})`;
const SPD=.8; /* velocidade geral das animações (menor = mais rápido) */
function A(el,frames,d=500,e='cubic-bezier(.2,.8,.2,1)'){return el.animate(frames,{duration:d*SPD,easing:e,fill:'forwards'}).finished.catch(()=>{});}
function reset(el,tr,op=1){el.getAnimations().forEach(a=>a.cancel());el.style.transform=tr;el.style.opacity=op;el.style.filter='';}

const be=O.makeBackend();
if(be.mode==='local'){const b=$('modeBadge');b.hidden=false;b.textContent='Modo teste local: abra outra aba para o 2º jogador e adm.html para o painel';}

/* identidade desta aba */
let myId=sessionStorage.getItem('oqg-id');if(!myId){myId=O.newId();sessionStorage.setItem('oqg-id',myId);}
let mySlot=sessionStorage.getItem('oqg-slot')||null;

let cfg=O.mergeCfg(null),cfgReady=false,G=null,P={},screen='lobby';
let lastKey='',tok=0,busy=false,resultShown=false,autoT=null,shownLevel=0,typed='';

/* ---------------- som ---------------- */
let AC,unlocked=false,pendingMusic=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.1,type='sine',v=.15,slide=0,delay=0){
  if(!cfg.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const SY={
  tick:()=>tone(rnd(1100,1500),.03,'square',.03),
  send:()=>tone(500,.12,'triangle',.12,900),
  whoosh:()=>tone(250,.28,'sawtooth',.05,1300),
  hit:()=>tone(160,.25,'square',.18,45),
  boom:()=>{tone(90,.6,'sawtooth',.22,30);tone(60,.5,'square',.12,25);},
  boing:()=>tone(140,.35,'triangle',.22,420),
  acerto:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,0,i*.09)),
  erro:()=>{tone(220,.25,'square',.1,0);tone(180,.35,'square',.1,0,.22);},
  perda:()=>[392,330,262,196,131].forEach((f,i)=>tone(f,.4,'sawtooth',.1,0,i*.2)),
  nivel:()=>{tone(120,1.3,'sawtooth',.07,1500);tone(240,1.3,'triangle',.05,2400);},
  pop:()=>tone(650,.09,'sine',.12,1100)
};
function playRef(ref,vol=1){

  if(LV===1){p.k='hex';p.x=rnd(0,W);p.y=init?rnd(0,H):H+40;p.s=rnd(10,30);p.vy=-rnd(.15,.45);p.r=rnd(0,6);p.vr=rnd(-.004,.004);p.a=rnd(.12,.3);}

  else{p.k='star';p.ang=rnd(0,Math.PI*2);p.d=init?rnd(5,Math.max(W,H)*.7):rnd(2,40);p.v=rnd(.4,1.4)*(LV===4?1.25:.7);p.s=rnd(.6,2);

function hexPath(x,y,s,r){cx.beginPath();for(let i=0;i<6;i++){const a=r+i*Math.PI/3;cx.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);}cx.closePath();}
function loop(){
  cx.clearRect(0,0,W,H);const cxm=W/2,cym=H*.48;
  for(let i=0;i<parts.length;i++){let p=parts[i];
    if(p.k==='hex'){p.y+=p.vy;p.r+=p.vr;if(p.y<-40)p=parts[i]=spawn(false);cx.strokeStyle=`rgba(255,255,255,${p.a})`;cx.lineWidth=3;hexPath(p.x,p.y,p.s,p.r);cx.stroke();}
    else if(p.k==='ember'){p.y+=p.vy;p.ph+=.05;p.x+=Math.sin(p.ph)*.6;if(p.y<-10)p=parts[i]=spawn(false);cx.fillStyle=p.c;cx.globalAlpha=.85;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.globalAlpha=1;}
    else{const d0=p.d;p.v*=1.012;p.d+=p.v;const x0=cxm+Math.cos(p.ang)*d0,y0=cym+Math.sin(p.ang)*d0,x1=cxm+Math.cos(p.ang)*p.d,y1=cym+Math.sin(p.ang)*p.d;
      if(x1<-20||x1>W+20||y1<-20||y1>H+20){parts[i]=spawn(false);continue;}
      cx.strokeStyle=p.c;cx.globalAlpha=Math.min(1,p.d/120);cx.lineWidth=p.s;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();cx.globalAlpha=1;}
  }

/* ---------------- HUD ---------------- */
function renderChain(el,list,nowIdx){
  const prevN=+(el.dataset.n||0),wrap=el.id==='eChain';
  el.innerHTML=list.map((it,k)=>(k?'<span class="sep">›</span>':'')+`<span class="c ${it.res||''}${k===nowIdx?' now':''}${!wrap&&k===list.length-1?' last':''}" title="${esc(it.name)}">${visHTML(it)}</span>`).join('');
  el.dataset.n=list.length;
  if(wrap)return;
  /* item novo entra com uma animação leve */
  if(prevN>0&&list.length===prevN+1){
    const cs=el.querySelectorAll('.c'),last=cs[cs.length-1],sep=el.lastElementChild&&el.lastElementChild.previousElementSibling;
    last.animate([{transform:'scale(0) rotate(-25deg)',opacity:0},{transform:'scale(1.25) rotate(6deg)',opacity:1,offset:.6},{transform:'scale(1) rotate(0)',opacity:1}],{duration:550,delay:150,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'backwards'});
    if(sep&&sep.classList.contains('sep'))sep.animate([{opacity:0,transform:'translateX(-6px)'},{opacity:.6,transform:'none'}],{duration:300,fill:'backwards'});
  }
  /* rola sozinho até o último item */
  requestAnimationFrame(()=>{el.classList.toggle('over',el.scrollWidth>el.clientWidth+2);
    el.scrollTo({left:el.scrollWidth,behavior:prevN&&list.length>=prevN?'smooth':'auto'});});
}
function hud(round,after){
  const dv=O.derive(cfg,after?round+1:round);
  $('counter').textContent=`${cfg.counterLabel}: ${dv.streak}`;
  renderChain($('chain'),dv.chain,-1);
  renderHearts(after?round+1:round);

function renderHearts(upto){

function setActive(s){['p1','p2'].forEach(x=>$('c-'+x).classList.toggle('active',x===s));}
function setVerdict(html,sub,cls){

function hardReset(){
  [def,att,def.querySelector('.name'),att.querySelector('.name'),$('passban'),$('goText'),$('c-p1'),$('c-p2')].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));

  $('passban').style.display='none';
  $('goText').style.opacity='';$('goText').innerHTML='';
  att.classList.remove('champ');def.classList.remove('champ');

const myTurn=()=>!!(G&&G.status==='playing'&&G.phase==='ask'&&cfg.steps[G.round]&&mySlot===cfg.steps[G.round].player);

/* ---------------- estados ---------------- */
function renderState(){
  if(!cfgReady||!G)return;
  const key=[G.status,G.round,G.phase,G.seq].join('|');
  if(key===lastKey){updateTyped();return;}
  const prev=lastKey;lastKey=key;tok++;
  hardReset();
  if(G.status==='playing'&&cfg.steps.length){
    const r=Math.max(0,Math.min(G.round||0,cfg.steps.length-1));
    show('game');
    if(G.phase==='reveal'){const inst=be.now()-(G.revealAt||0)>7000;setLevel(inst?cfg.steps[r].level:lvBefore(r),false);playReveal(r,tok,inst);}
    else{setLevel(lvBefore(r),false);setupAsk(r,prev);}
  }else if(G.status==='end'){show('end');renderEnd();}
  else{show('lobby');setLevel(1,false);renderPlayers();}
}
function setupAsk(r,prev){
  const step=cfg.steps[r];const {cur}=O.derive(cfg,r);
  const smooth=prev&&prev.indexOf('playing|'+(r-1)+'|reveal')===0;
  setEnt(def,cur);reset(att,T(0,0),0);
  if(smooth){reset(def,T(0,-10,1.15));A(def,[{transform:T(0,-10,1.15)},{transform:T(0,0,1)}],250);}
  else{reset(def,T(0,0,0));A(def,[{transform:T(0,0,0,0,-40)},{transform:T(0,0,1)}],380,'cubic-bezier(.3,1.5,.5,1)');SY.pop();}
  setVerdict(fill(cfg.question).replace('{item}',`<span class="it">${esc(cur.name)}</span>`),
    (cfg.turnText||'').split('{jogador}').join(pName(step.player)),'');
  setActive(step.player);hud(r,false);
  typed='';inp.value=(G&&G.typed)||'';inp.disabled=false;
  const mine=mySlot===step.player;
  inp.readOnly=!mine;inp.classList.toggle('myturn',mine);
  inp.placeholder=mine?cfg.placeholderMine:(cfg.placeholderOther||'').split('{jogador}').join(pName(step.player));
  $('sendBtn').disabled=!mine;
  if(mine){typed=inp.value;if(!('ontouchstart' in window))setTimeout(()=>inp.focus(),60);}
}
function updateTyped(){
  if(!G||G.status!=='playing'||G.phase!=='ask')return;
  if(myTurn())return; /* quem digita manda */
  const t=G.typed||'';if(t.length>inp.value.length)SY.tick();inp.value=t;
}
async function playReveal(r,t,instant){
  busy=true;
  const step=cfg.steps[r];const {cur}=O.derive(cfg,r);const win=step.result==='ganha';
  setActive(step.player);hud(r,false);
  inp.value=step.name;inp.disabled=true;inp.classList.remove('myturn');$('sendBtn').disabled=true;
  $('verdict').className='';$('verdict').innerHTML=fill(cfg.question).replace('{item}',`<span class="it">${esc(cur.name)}</span>`);$('sub').textContent='';
  setEnt(def,cur);setEnt(att,step);const g=geom();
  if(instant){
    if(win){reset(def,T(g.d,0),0);reset(att,T(0,-10,1.15));att.classList.add('champ');}
    else{reset(def,T(0,0,1.1));def.classList.add('champ');reset(att,T(0,0),0);}
    showResult(r,step,cur,t,true);return;
  }
  const sb=$('sendBtn');sb.classList.add('pressed');SY.send();await sleep(90);sb.classList.remove('pressed');
  /* o nível novo só aparece depois que a resposta é enviada */
  const lvNew=Math.max(1,Math.min(5,Number(step.level)||1));
  if(lvNew!==shownLevel){const up=lvNew>shownLevel;setLevel(lvNew,true);if(up&&cfg.levels[lvNew-1].intro){await sleep(1000);if(t!==tok)return;}}
  playRef(step.audio);SY.whoosh();
  A(def,[{transform:T(0,0)},{transform:T(g.d,0)}],320);
  reset(att,T(-g.d-600,0),1);
  await A(att,[{transform:T(-g.d-600,0,.6,.6,-30)},{transform:T(-g.d,0,1.1,1.1,6),offset:.8},{transform:T(-g.d,0)}],400,'cubic-bezier(.2,.9,.3,1.2)');
  if(t!==tok)return;await sleep(100);if(t!==tok)return;
  if(win){
    let an=step.anim;if(!FX[an]||an==='falha')an=pick(['esmagar','embrulhar','cortar','queimar','engolir','explodir','desintegrar','evaporar','empurrar','fugir','pular','ensaboar','demolir','atolar']);
    await FX[an](g);if(t!==tok)return;
    const cur2=getComputedStyle(att).transform;att.classList.add('champ');
    A(att,[{transform:cur2},{transform:T(0,-10,1.15)}],500,'cubic-bezier(.3,1.4,.4,1)');
  }else{await FX.falha(g);if(t!==tok)return;}
  showResult(r,step,cur,t,false);
}
function showResult(r,step,cur,t,instant){
  const nextStep=cfg.steps[r+1],oc=O.outcome(cfg,r);
  if(oc==='ganha'){
    if(!instant)sfx('acerto');
    setVerdict(fill(step.phrase,{vencedor:step.name,perdedor:cur.name}),step.sub,'win');
  }else if(oc==='erra'){
    if(!instant){sfx('erro');heartBreak(step.player);}
    setVerdict(fill(step.phrase,{vencedor:cur.name,perdedor:step.name}),step.sub,'miss');
    const to=nextStep?nextStep.player:O.other(step.player);
    const pb=$('passban');
    pb.innerHTML=`<div class="hexph"><div class="ph-in"></div></div><span>${fill(cfg.passText,{jogador:pName(to)})}</span>`;
    paintPhoto(pb.querySelector('.ph-in'),to);pb.style.display='flex';
    if(!instant){SY.whoosh();pb.animate([{transform:'translateX(60vw)',opacity:0},{transform:'translateX(-55%)',opacity:1,offset:.7},{transform:'translateX(-50%)',opacity:1}],{duration:700,delay:600,easing:'cubic-bezier(.3,1.3,.5,1)',fill:'both'});}
  }else{
    setVerdict(fill(step.phrase,{vencedor:cur.name,perdedor:step.name}),step.sub,'lose');
    if(!instant)heartBreak(step.player);
    gameOverFx(step,instant);
  }
  hud(r,true);busy=false;resultShown=true;
  if(mySlot)$('nextBtn').classList.add('show');
  $('nextBtn').textContent=(oc==='perde'||r>=cfg.steps.length-1)?'Ver final':'Próximo';
  /* quem acabou de responder conduz o avanço automático */
  if(mySlot===step.player){
    const delay=oc==='perde'?(Number(cfg.loseDelay)||4)*1000:(Number(cfg.autoNext)||0)*1000;
    if(delay>0)autoT=setTimeout(()=>{if(t===tok)O.advance(be,cfg,{round:r,phase:'reveal'});},instant?Math.min(delay,1500):delay);
  }
}
function gameOverFx(step,instant){
  const loser=step.player,winner=O.other(loser);
  document.body.classList.add('gameover');updateMusic();
  $('c-'+winner).classList.add('crowned');
  const lc=$('c-'+loser);
  const gt=$('goText');gt.innerHTML=fill(cfg.loseText,{perdedor:pName(loser),vencedor:pName(winner)});
  if(instant){gt.style.opacity=1;return;}
  sfx('perda');flash(1);shake(18);
  lc.animate([{transform:'none'},{transform:'translateX(-8px) rotate(-4deg)',offset:.1},{transform:'translateX(8px) rotate(4deg)',offset:.2},{transform:'translateX(-6px)',offset:.3},{transform:'translateY(0) rotate(0)',filter:'grayscale(1)',offset:.45},{transform:'translateY(110vh) rotate(35deg)',filter:'grayscale(1)'}],{duration:2200,delay:500,easing:'ease-in',fill:'forwards'});
  gt.animate([{opacity:0,transform:'translateY(-60vh) rotate(-8deg)'},{opacity:1,transform:'translateY(0) rotate(3deg)',offset:.6},{opacity:1,transform:'translateY(-14px) rotate(-2deg)',offset:.8},{opacity:1,transform:'none'}],{duration:1100,delay:700,easing:'ease-out',fill:'forwards'});
  setTimeout(()=>{SY.boom();shake(12);},1350);
}
function renderEnd(){
  if(!G)return;
  const r=Math.max(0,Math.min(G.round||0,cfg.steps.length-1));const last=cfg.steps[r];
  const dv=O.derive(cfg,r+1);
  let winner=null,loser=null;
  if(last&&O.outcome(cfg,r)==='perde'){loser=last.player;winner=O.other(loser);}else if(last){winner=last.player;loser=O.other(winner);}
  const wn=winner?pName(winner):'',ln=loser?pName(loser):'';
  setLevel(last?last.level:1,false);
  $('eTitle').textContent=cfg.endTitle;
  $('eText').innerHTML=fill(cfg.endText,{vencedor:wn,perdedor:ln,final:dv.cur.name,n:String(dv.streak)});
  if(winner)paintPhoto($('eWin').querySelector('.ph-in'),winner);
  $('eWinName').textContent=wn?'🏆 '+wn:'';$('eWinName').style.display=wn?'':'none';
  $('eLose').innerHTML=loser?`<div class="hexph"><div class="ph-in"></div></div><span>💀 ${esc(ln)}</span>`:'';
  if(loser)paintPhoto($('eLose').querySelector('.ph-in'),loser);
  renderChain($('eChain'),dv.chain,-1);$('eChain').style.display=cfg.showChain?'':'none';
}

/* ---------------- digitação ----------------
   modo "roteiro": qualquer tecla vira a próxima letra do roteiro
   modo "livre": digita o que quiser, mas só envia se for a resposta do roteiro (sem ligar para maiúsculas e acentos) */
function target(){return (G&&cfg.steps[G.round]&&cfg.steps[G.round].name)||'';}
const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const freeMode=()=>cfg.typingMode==='livre';
inp.addEventListener('input',()=>{
  if(!myTurn()){inp.value=(G&&G.typed)||'';return;}
  const before=typed;
  if(freeMode()){typed=inp.value.slice(0,40);}
  else{
    const t=[...target()],v=[...inp.value];let n=[...typed].length;
    if(v.length>n)n=Math.min(t.length,v.length);else if(v.length<n)n=Math.max(0,v.length);
    typed=t.slice(0,n).join('');inp.value=typed;
    try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){}
  }
  if(typed!==before){if(typed.length>before.length)SY.tick();be.update('game',{typed}).catch(()=>{});}
});
function submit(){
  if(!myTurn())return;
  const ok=freeMode()?norm(typed)===norm(target()):typed===target();
  if(!ok){inp.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250});return;}
  O.advance(be,cfg,{round:G.round,phase:'ask'});
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
$('sendBtn').addEventListener('click',e=>{e.currentTarget.blur();submit();});
function nextClick(){if(resultShown&&G&&G.status==='playing')O.advance(be,cfg,{round:G.round,phase:'reveal'});}
$('nextBtn').addEventListener('click',e=>{e.currentTarget.blur();nextClick();});
arena.addEventListener('click',()=>{if(myTurn())inp.focus();else if(mySlot)nextClick();});
document.addEventListener('keydown',e=>{
  if(screen!=='game'||e.target===inp)return;
  if(e.target.closest&&e.target.closest('input,textarea,button,select'))return;
  if((e.key===' '||e.key==='Enter')&&resultShown&&mySlot){e.preventDefault();nextClick();}
  else if(myTurn()&&e.key.length===1){inp.focus();}
});
$('soundTip').onclick=unlock;

/* ---------------- conexão ---------------- */
be.ensureAnon().then(()=>{
  be.on('config',async c=>{
    cfg=O.mergeCfg(c);await M.preload(be,cfg);cfgReady=true;
    applyTexts();renderPlayers();lastKey='';renderState();
  });
  be.on('players',p=>{P=p||{};P._loaded=true;if(cfgReady)renderPlayers();});
  be.on('game',g=>{G=g||{status:'lobby',round:0,phase:'ask',seq:0};renderState();});
  let rbase;be.on('control/reload',v=>{if(rbase===undefined){rbase=v;return;}if(v!==rbase)location.reload();});
});
})();
</script>
</body>
