async function connect(site,opts){
  opts=opts||{};
  if(opts.forceLocal)return localBackend(site);
  const q=new URLSearchParams(location.search);
  if(q.has('local'))return localBackend(site);
  let ok=false;
  if(window.Trava&&window.Trava.ready){
    try{const t=await window.Trava.ready;ok=!!(t&&window.firebase&&firebase.apps&&firebase.apps.length);}catch(e){ok=false;}
  }else if(window.firebase&&window.OQG_FIREBASE&&/^https?:/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname)){
    /* sem trava, mas publicado: usa a config reserva */
    try{if(!firebase.apps.length)firebase.initializeApp(window.OQG_FIREBASE);ok=true;}catch(e){ok=false;}
  }
  if(!ok)return localBackend(site);
  const root=window.DB_ROOT||('sites/'+site);
  return firebaseBackend(root);
}
/* navegador da equipe: avisa a Central quais pastas os jogadores podem gravar */
async function registerWrites(be,site,nodes){
  if(be.mode!=='firebase'||!window.Trava||!window.Trava.admin||!site)return;
  try{
    const ref=be.db.ref('controle/sites/'+site);
    const cur=(await ref.once('value')).val();
    const esc={};nodes.forEach(n=>esc[n]=true);
    if(!cur)await ref.set({open:false,escrita:esc,t:firebase.database.ServerValue.TIMESTAMP});
    else{const miss=nodes.filter(n=>!(cur.escrita&&cur.escrita[n]));for(const n of miss)await ref.child('escrita/'+n).set(true);}
  }catch(e){console.warn('controle',e);}
}

/* ---------- controle da partida ---------- */
function startGame(be,round){
  round=round||0;
  return be.tx('game',g=>({status:'playing',round,phase:'ask',typed:'',revealAt:0,seq:((g&&g.seq)||0)+1}));
}
function toLobby(be){return be.tx('game',g=>({status:'lobby',round:0,phase:'ask',typed:'',revealAt:0,seq:((g&&g.seq)||0)+1}));}
function advance(be,cfg,expect){
  const now=be.now();
  return be.tx('game',g=>{
    if(g===null)return null;
    if(!g||g.status!=='playing')return;
    if(expect&&(g.round!==expect.round||g.phase!==expect.phase))return;
    const st=cfg.steps[g.round];const seq=(g.seq||0)+1;
    if(!st)return Object.assign({},g,{status:'end',seq});
    if(g.phase==='ask')return Object.assign({},g,{phase:'reveal',typed:st.name,revealAt:now,seq});
    if(outcome(cfg,g.round)==='perde'||g.round>=cfg.steps.length-1)return Object.assign({},g,{status:'end',seq});
    return Object.assign({},g,{round:g.round+1,phase:'ask',typed:'',revealAt:0,seq});
  });
}
function redoRound(be){
  return be.tx('game',g=>{if(g===null)return null;if(!g)return;return Object.assign({},g,{status:'playing',phase:'ask',typed:'',revealAt:0,seq:(g.seq||0)+1});});

function readDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file);});}
async function resizeImage(file,max){
  const src=await readDataURL(file);
  return new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');

}

})();

function field(obj,path,label,type,opt){

  if(type==='check'){
    input=h('input',{type:'checkbox'});input.checked=opt.inv?!cur:!!cur;
    input.onchange=()=>set(opt.inv?!input.checked:input.checked,true);

  }
  if(type==='area'){input=h('textarea',{placeholder:opt.ph||''});input.value=cur==null?'':cur;input.oninput=()=>set(input.value,false);input.onchange=()=>set(input.value,true);return wrapF(input);}

  }

    const toHex=v=>/^#[0-9a-f]{6}$/i.test(v||'')?v:/^#[0-9a-f]{3}$/i.test(v||'')?'#'+v.slice(1).split('').map(x=>x+x).join(''):'#ffffff';

    tx.oninput=()=>{cc.value=toHex(tx.value);set(tx.value,false);};tx.onchange=()=>set(tx.value,true);
    return wrapF(h('div',{class:'row'},cc,tx));

  if(type==='num'||type==='sec'||type==='range'){
    const isS=type==='sec';const show=v=>isS?(v==null||v===''?'':fmtS(v)):(v==null?'':v);

    const read=()=>{if(input.value===''&&opt.blank)return undefined;const v=Number(input.value);return isS?Math.round(v*1000):v;};
    const out=type==='range'?h('span',{style:'min-width:44px;text-align:right'},String(cur)):null;
    input.oninput=()=>{const v=read();if(out)out.textContent=String(v);set(v,false);};input.onchange=()=>set(read(),true);
    return wrapF(out?h('div',{class:'row'},h('div',{class:'grow'},input),out):h('div',{class:'row'},input,isS?h('span',{class:'kbd'},'seg'):opt.unit?h('span',{class:'kbd'},opt.unit):null));

  return wrapF(input);
}

function guessName(f){return f.name.replace(/\.[^.]+$/,'').slice(0,40);}
async function addFiles(files,opts){
  opts=opts||{};const ids=[];
  for(const f of files){
    const isA=/^audio\//.test(f.type)||/\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name);

    if(!isA&&!isI){toast('Ignorei '+f.name+' (não é imagem nem som)');continue;}
    let data=await readDataURL(f);

function readDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file);});}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function shrinkImage(src,max){
  const im=await loadImg(src);if(Math.max(im.width,im.height)<=max)return src;
  const s=max/Math.max(im.width,im.height),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/webp',.9);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/png');return u;
}
/* tira fundo liso (opcional), corta bordas vazias e centraliza num quadrado */
async function processImage(src,opt){
  opt=opt||{};const size=opt.size||360,fill=opt.fill||.9,tol=opt.tol||60;
  const im=await loadImg(src);
  const sc=Math.min(1,800/Math.max(im.width,im.height));
  const w=Math.max(1,Math.round(im.width*sc)),hh=Math.max(1,Math.round(im.height*sc));
  const c=document.createElement('canvas');c.width=w;c.height=hh;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,hh);
  const d=x.getImageData(0,0,w,hh),p=d.data;
  if(opt.removeBg){
    const N=w*hh,seen=new Uint8Array(N),q=new Int32Array(N);let qh=0,qt=0;
    const nbs=k=>{const xx=k%w,yy=(k/w)|0;return[xx>0?k-1:-1,xx<w-1?k+1:-1,yy>0?k-w:-1,yy<hh-1?k+w:-1];};
    const edge=[];
    for(let i=0;i<w;i++){[i,(hh-1)*w+i].forEach(k=>{if(!seen[k]){seen[k]=1;q[qt++]=k;}});}
    for(let j=0;j<hh;j++){[j*w,j*w+w-1].forEach(k=>{if(!seen[k]){seen[k]=1;q[qt++]=k;}});}
    const firstRing=qt;for(let i=0;i<firstRing;i++){const k=q[i];if(p[k*4+3]>=20)edge.push(k);}
    while(qh<qt){const k=q[qh++];if(p[k*4+3]>=20)continue;for(const n of nbs(k)){if(n<0||seen[n])continue;seen[n]=1;if(p[n*4+3]<20)q[qt++]=n;else edge.push(n);}}
    const cnt={};let best=-1,bn=0;
    edge.forEach(k=>{const i=k*4,key=(p[i]>>4)+','+(p[i+1]>>4)+','+(p[i+2]>>4);cnt[key]=(cnt[key]||0)+1;if(cnt[key]>bn){bn=cnt[key];best=k;}});
    if(best>=0){
      const R=p[best*4],Gc=p[best*4+1],B=p[best*4+2];const dist=i=>Math.abs(p[i]-R)+Math.abs(p[i+1]-Gc)+Math.abs(p[i+2]-B);
      const seen2=new Uint8Array(N);qh=0;qt=0;
      edge.forEach(k=>{if(!seen2[k]&&dist(k*4)<tol*1.4){seen2[k]=1;q[qt++]=k;}});
      while(qh<qt){const k=q[qh++],i=k*4,dd=dist(i);
        if(dd<tol){p[i+3]=0;}else{p[i+3]=Math.min(p[i+3],Math.round(255*(dd-tol)/(tol*.4)));continue;}
        for(const n of nbs(k)){if(n<0||seen2[n])continue;const ni=n*4;if(p[ni+3]>=20&&dist(ni)<tol*1.4){seen2[n]=1;q[qt++]=n;}}}
      x.putImageData(d,0,0);
    }
  }
  let x0=w,y0=hh,x1=-1,y1=-1;
  for(let yy=0;yy<hh;yy++)for(let xx=0;xx<w;xx++){if(p[(yy*w+xx)*4+3]>16){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy;}}
  if(x1<0){x0=0;y0=0;x1=w-1;y1=hh-1;}
  const bw=x1-x0+1,bh=y1-y0+1,k=Math.min(size*fill/bw,size*fill/bh);
  const o=document.createElement('canvas');o.width=o.height=size;
  o.getContext('2d').drawImage(c,x0,y0,bw,bh,(size-bw*k)/2,(size-bh*k)/2,bw*k,bh*k);
  let u=o.toDataURL('image/webp',.92);if(u.indexOf('data:image/webp')!==0)u=o.toDataURL('image/png');return u;
}

  }else if(E.favBorda==='contorno'&&esp>0){
    const sil=document.createElement('canvas');sil.width=sil.height=size;const sx=sil.getContext('2d');sx.drawImage(fig,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle=E.favCorBorda||'#000';sx.fillRect(0,0,size,size);
    for(let a=0;a<32;a++){const t=a/32*Math.PI*2;x.drawImage(sil,Math.cos(t)*esp,Math.sin(t)*esp);}
    x.drawImage(fig,0,0);
  }else x.drawImage(fig,0,0);
  return c.toDataURL('image/png');
}

async function reencode(du,q){

}

async function urlToData(u){const b=await (await fetch(u)).blob();return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});}
async function buildExport(){
  const E=P.export,c=clone(cfg());
  const ids=usedAssets(c),paths={},files=[],names=new Set();
  for(const id of ids){
    const a=P.assets[id];let du0=/^data:/.test(a.data)?a.data:await urlToData(a.data);let du=a.tipo==='img'?await reencode(du0,num(E.qualidade,.9)):du0;
    const ext=EXT[mimeOf(du)]||(a.tipo==='img'?'png':'mp3');let base=slug(a.nome),nm=base,i=2;
    while(names.has(nm+'.'+ext))nm=base+'-'+(i++);names.add(nm+'.'+ext);
    const path=(a.tipo==='img'?'IMG/':'SOM/')+nm+'.'+ext;paths[id]=path;files.push({name:path,data:dataToBytes(du)});
  }
  const fav=await makeFavicon(64);files.push({name:'favicon.png',data:dataToBytes(fav)});
  const titulo=E.titulo||c.title;
  const idx=runtimeHTML({modo:'jogo',cfg:c,assets:paths,site:E.site,trava:E.trava,titulo,favicon:'favicon.png',fb:FB}).replace('</body>',()=>`<script>window.OQG_EXP=/*EXP*/${JSON.stringify({site:E.site,trava:E.trava,adm:E.adm,titulo:E.titulo,favFonte:E.favFonte,favEmoji:E.favEmoji,favBorda:E.favBorda,favCorBorda:E.favCorBorda,favCorFundo:E.favCorFundo,favPreencher:E.favPreencher,favEsp:E.favEsp,qualidade:E.qualidade}).replace(/</g,'\\u003c')}/*FIMEXP*/;<\/script>\n</body>`);
  files.unshift({name:'index.html',data:idx});
  if(E.adm!==false){const ap={};for(const id in paths)ap[id]='../'+paths[id];files.push({name:'ADM/index.html',data:admHTML({cfg:c,assets:ap,site:E.site,trava:E.trava,favicon:'../favicon.png'})});}
  files.push({name:'LEIA-ME.txt',data:leiame(E,c,files.map(f=>f.name).concat(['LEIA-ME.txt']))});
  return files;
}

async function importZip(buf){
  const files=await readZip(buf);const dec=new TextDecoder();
  let idxName=Object.keys(files).filter(n=>/(^|\/)index\.html$/i.test(n)&&!/(^|\/)ADM\//i.test(n)).sort((a,b)=>a.length-b.length).find(n=>dec.decode(files[n]).indexOf('/*CFG*/')>=0);
  if(!idxName)throw new Error('Não achei o index.html exportado pela engine dentro do ZIP');
  const root=idxName.slice(0,idxName.length-'index.html'.length);const html=dec.decode(files[idxName]);
  const cut=(a,b)=>{const i=html.indexOf(a),j=html.indexOf(b,i);return i>=0&&j>i?html.slice(i+a.length,j):null;};
  const c=JSON.parse(cut('/*CFG*/','/*FIMCFG*/'));const amap=JSON.parse(cut('/*ASSETS*/','/*FIMASSETS*/')||'{}');const exp=JSON.parse(cut('/*EXP*/','/*FIMEXP*/')||'{}');
  const assets={};
  for(const id in amap){const path=root+amap[id];const data=files[path];if(!data)continue;const ext=(path.split('.').pop()||'').toLowerCase();const mime=MIME[ext]||'application/octet-stream';
    assets[id]={nome:(path.split('/').pop()||id).replace(/\.[^.]+$/,''),tipo:mime.indexOf('audio')===0?'audio':'img',mime,data:bytesToData(data,mime)};}
  P=completarProjeto({nome:c.title,cfg:c,assets,export:exp});afterLoad(true);
}

  const assets={},emb=window.OQG_ASSETS||{};

  for(const id in media||{})if(media[id]&&media[id].data)assets[id]=media[id];

}
