<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>ADM · O que ganha de...?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='25,8 75,8 98,50 75,92 25,92 2,50' fill='%2300d0e0' stroke='%23071a2b' stroke-width='6'/><text x='50' y='66' font-size='46' text-anchor='middle'>⚙️</text></svg>">
<style>
:root{--bg:#0d1117;--p1:#151b23;--p2:#1c2430;--p3:#232d3b;--line:#2b3747;--tx:#e6edf3;--mu:#8b9bb0;--ac:#1ec8e6;--ac2:#ff3d9a;--ok:#2fd27b;--warn:#ffb020;--bad:#ff5c6c;--gold:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--p1);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;margin-right:8px;white-space:nowrap}.brand b{color:var(--ac)}
#status{color:var(--mu);font-size:12px;margin-right:auto;white-space:nowrap}
.btn{background:var(--p3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ac)}
.btn:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.btn.pri{background:var(--ac);color:#03222a;border-color:var(--ac)}
.btn.hot{background:var(--gold);color:#2a2000;border-color:var(--gold)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
#body{display:grid;grid-template-columns:440px 1fr;min-height:0}
aside{display:flex;flex-direction:column;min-height:0;background:var(--p1);border-right:1px solid var(--line)}
#tabs{display:flex;flex-wrap:wrap;gap:3px;padding:7px;border-bottom:1px solid var(--line)}
#tabs button{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 8px;cursor:pointer;font-weight:600;color:var(--mu)}
#tabs button:hover{color:var(--tx)}
#tabs button.on{background:var(--p3);border-color:var(--line);color:var(--tx)}
#panel{flex:1;overflow:auto;padding:10px 12px 60px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#pvbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--p1);border-bottom:1px solid var(--line);flex-wrap:wrap}
#pvbar select,#tlbar select{background:var(--p3);border:1px solid var(--line);border-radius:7px;padding:4px 6px;width:auto;max-width:260px}
#pvwrap{flex:1;min-height:200px;position:relative;background:repeating-conic-gradient(#11161d 0 25%,#0d1117 0 50%) 0 0/24px 24px;overflow:hidden}
#pvbox{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;box-shadow:0 0 0 1px #ffffff22,0 10px 40px #0008}
#pv{width:1920px;height:1080px;border:0;display:block;background:#000}
#tl{height:0;overflow:hidden;background:var(--p1);border-top:1px solid var(--line);display:flex;flex-direction:column}
#tl.on{height:290px}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac)}
h3:first-child{margin-top:2px}
.note{color:var(--mu);font-size:12px;margin:4px 0 8px}
.warn{background:#3a2b08;border:1px solid #8a6514;color:#ffd98a;border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
.okbox{background:#0b2d1c;border:1px solid #1d7a4a;color:#9df0c4;border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
.f{display:grid;grid-template-columns:128px 1fr;align-items:center;gap:6px;margin:4px 0}
.f>label{color:var(--mu);font-size:12px}
.f.wide{grid-template-columns:1fr}
.f.wide>label{margin-bottom:-2px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{min-height:54px;resize:vertical}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;flex:none;cursor:pointer}
input[type=range]{width:100%}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.row>input[type=text]{flex:1;width:auto}
.grow{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini{display:flex;flex-direction:column;gap:2px}
.mini>label{color:var(--mu);font-size:11px}
.card{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;margin:4px 0}
.list .it{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;margin:3px 0;background:var(--p2);cursor:pointer}
.list .it:hover{border-color:var(--ac)}
.list .it.sel{border-color:var(--ac2);background:#2a1630}
.it .n{width:24px;text-align:right;color:var(--mu);font-weight:700;flex:none}
.it .th{width:30px;height:30px;display:grid;place-items:center;font-size:21px;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it .th img{width:100%;height:100%;object-fit:contain}
.it .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sm{color:var(--mu);font-size:11px;white-space:nowrap}
.tag{display:inline-block;padding:0 6px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.tag.ganha{color:var(--ok)}.tag.erra{color:var(--warn)}.tag.perde{color:var(--bad)}.tag.vitoria{color:var(--ok)}.tag.erro{color:var(--warn)}.tag.especial{color:var(--ac)}
.stepedit{border:1px solid var(--ac2);border-radius:10px;padding:8px;margin:2px 0 8px;background:#1d1424}
.assetbox{display:flex;align-items:center;gap:6px}
.assetbox .pv{width:34px;height:34px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--mu);flex:none;background:#0004}
.assetbox .pv img{width:100%;height:100%;object-fit:contain}
.assetbox .nmx{flex:1;min-width:0;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.lib .a{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.lib .a:hover{border-color:var(--ac)}
.lib .a .im{height:70px;display:grid;place-items:center;background:#0005;border-radius:5px;overflow:hidden;font-size:26px}
.lib .a .im img{max-width:100%;max-height:100%;object-fit:contain}
.lib .a .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .a .x{position:absolute;right:3px;top:3px;background:#000a;border:0;border-radius:5px;color:var(--bad);cursor:pointer;padding:0 5px;display:none}
.lib .a:hover .x{display:block}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mu);margin:6px 0}
.drop.over{border-color:var(--ac);color:var(--ac)}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100;padding:20px}
.modal.on{display:grid}
.mbox{background:var(--p1);border:1px solid var(--line);border-radius:14px;max-width:min(1100px,100%);max-height:100%;overflow:auto;padding:14px 16px;width:100%}
.mbox h2{margin:0 0 8px;font-size:17px}
#testbox{width:100%;height:100%;display:flex;flex-direction:column;gap:8px}
#testfr{flex:1;border:0;border-radius:10px;background:#000;width:100%}
/* timeline */
#tlbar{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlbar .t{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;min-width:64px}
#tlmain{flex:1;display:grid;grid-template-columns:150px 1fr;min-height:0}
#tlnames{border-right:1px solid var(--line)}
#tlnames div,.tlrow{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#tlnames div{padding:0 8px;font-weight:700;color:var(--mu);font-size:12px}
#tlnames div.rul{height:26px}
#tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
#tlin{position:relative;min-width:100%}
.rul{height:26px;position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.rul span{position:absolute;top:4px;font-size:10px;color:var(--mu);transform:translateX(-50%)}
.rul i{position:absolute;bottom:0;width:1px;height:6px;background:var(--line)}
.tlrow{position:relative}
.kf{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--ac);transform:rotate(45deg);border:2px solid #fff3;cursor:ew-resize;border-radius:2px}
.kf.def{background:#ff9a3c}
.kf.sel{background:var(--ac2);border-color:#fff;box-shadow:0 0 0 3px #ff3d9a55}
.kf.stp{border-radius:0;background:#8b9bb0}
.seg{position:absolute;top:50%;height:4px;margin-top:-2px;background:#1ec8e644;border-radius:2px;pointer-events:none}
.seg.def{background:#ff9a3c44}
.evrow{height:84px!important}
.evm{position:absolute;transform:translateX(-50%);background:var(--p3);border:1px solid var(--line);border-radius:6px;padding:0 3px;cursor:ew-resize;font-size:12px;line-height:16px;white-space:nowrap;font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.evm.sel{border-color:var(--ac2);background:#3a1630}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;z-index:5}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--gold)}
.kbd{font-size:11px;color:var(--mu)}
.fav-prev{display:flex;gap:10px;flex-wrap:wrap}
.tabmock{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px 10px 0 0;min-width:200px;font:13px system-ui}
.tabmock img{width:16px;height:16px}
.filelist{font-family:ui-monospace,monospace;font-size:11px;background:#0006;border-radius:8px;padding:8px;max-height:160px;overflow:auto;white-space:pre}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--ac);padding:8px 14px;border-radius:10px;z-index:200;font-weight:600;transition:opacity .3s}
@media (max-width:1100px){#body{grid-template-columns:360px 1fr}.f{grid-template-columns:100px 1fr}}
</style>

<script type="text/plain" id="rt-css">:root{
  --ink:#0e2a47;--card:#ffffff;--edge:#0e2a47;--accent:#1f6bff;--good:#15b863;--bad:#f0344a;--miss:#ff8a1f;--gold:#ffe14d;
  --txt:#0e2a47;--sb:rgba(14,42,71,.35);--sz:200px;--namefs:34px;--btxt:#ffffff;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --hex:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--body);font-weight:800;color:var(--ink);background:#c9f4ff}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- fundo (preenche a janela inteira) ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:filter 1.2s}
#bgl{position:absolute;inset:0}
.bgl{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background-size:cover;background-position:center}
.bgl.on{opacity:1}
.rays{position:absolute;left:50%;top:42%;width:230vmax;height:230vmax;transform:translate(-50%,-50%);opacity:0;transition:opacity 2s;visibility:hidden;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.34) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 50s linear infinite;animation-play-state:paused}
body.raios .rays{opacity:1;visibility:visible;animation-play-state:running}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hexmark{position:absolute;left:50%;top:52%;width:min(66vmin,540px);aspect-ratio:1;transform:translate(-50%,-50%);clip-path:var(--hex);background:var(--hexcor,rgba(255,255,255,.28));transition:background 1.5s,opacity 1.5s;opacity:0}
body.hexon .hexmark{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;opacity:0;transition:opacity 1.5s;box-shadow:inset 0 0 18vmin rgba(0,0,0,.7)}
body.vinheta .vig{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
body.gameover #bg,body.gameover .arena{filter:grayscale(1) brightness(.6)}

/* ---------- palco 1920x1080 ---------- */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;transform:translate(-50%,-50%);z-index:1;overflow:hidden}
body.nocorte #stage{overflow:visible}
.screen{display:none;position:absolute;inset:0}
.screen.on{display:block}
.L{position:absolute;display:flex;align-items:center;justify-content:center;font-size:var(--fs,20px);text-align:center}
.L.l-off{display:none!important}
.btn{font-family:var(--display);background:var(--accent);color:var(--btxt);border:3px solid var(--edge);border-radius:18px;
  box-shadow:0 5px 0 var(--edge);padding:.3em 1em;cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:active,.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink)}
.bigtitle{font-family:var(--display);font-weight:400;line-height:.95;margin:0;color:var(--tcor,#fff);-webkit-text-stroke:.035em var(--edge);paint-order:stroke fill;text-shadow:0 .07em 0 var(--edge)}
.subtitle{font-weight:800;color:var(--txt);margin:0}
.hint{font-weight:800;color:var(--txt);opacity:.85;margin:0}
.hexph{width:56px;height:56px;flex:none;background:var(--edge);clip-path:var(--hex);display:grid;place-items:center}
.ph-in{width:calc(100% - 7px);height:calc(100% - 7px);clip-path:var(--hex);background:#fff center/cover no-repeat;display:grid;place-items:center;
  font-family:var(--display);font-size:calc(1em + 10px);color:var(--edge)}
.nameinput{font-family:var(--display);font-size:inherit;width:8em;border:2px solid var(--edge);border-radius:8px;padding:0 6px;color:var(--ink)}

/* ---------- lobby ---------- */
.slots{gap:1.6em}
.slot{background:var(--card);border:3px solid var(--edge);border-radius:1.3em;box-shadow:0 6px 0 var(--edge);padding:.9em .8em;width:12.5em;display:flex;flex-direction:column;align-items:center;gap:.5em}
.slot .hexph{width:5.6em;height:5.6em;font-size:1.6em}
.slot .hexph{font-size:1em;width:5.6em;height:5.6em}
.slot .pname{font-family:var(--display);font-size:1.2em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .state{font-weight:800;font-size:.65em;color:#4a6a82}
.slot .btn{font-size:.9em}
.slot.mine{box-shadow:0 0 0 4px var(--gold),0 6px 0 var(--edge)}
.mine .hexph,.mine .pname,.slot .hexph,.slot .pname{cursor:pointer}
.lbtns{gap:14px}
.lbtns .btn{font-size:1em}
.badge{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font:800 12px var(--body);background:var(--gold);border:2px solid var(--edge);border-radius:999px;padding:3px 12px;z-index:30}

/* ---------- jogo ---------- */
.pbox{justify-content:flex-start}
.pbox.right{justify-content:flex-end}
.pcard{height:100%;max-width:100%;display:flex;align-items:center;background:var(--card);border:3px solid var(--edge);border-radius:999px;box-shadow:0 4px 0 var(--edge);
  position:relative;transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .35s;transform-origin:left center}
.pcard.right{transform-origin:right center;flex-direction:row-reverse}
.pcard .hexph{width:calc(var(--h) - 16px);height:calc(var(--h) - 16px);margin:0 .4em 0 5px;font-size:calc(var(--h) * .3)}
.pcard.right .hexph{margin:0 5px 0 .4em}
.pinfo{display:flex;flex-direction:column;min-width:0;line-height:1.1;padding-right:.8em;align-items:flex-start}
.pcard.right .pinfo{align-items:flex-end;padding-right:0;padding-left:.8em}
.pcard .pname{font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hearts{font-family:var(--emoji);font-size:.75em;letter-spacing:1px;white-space:nowrap}
.hearts:empty{display:none}
.hearts .lost{filter:grayscale(1);opacity:.35}
.brokeheart{position:absolute;left:0;top:0;font-family:var(--emoji);font-size:44px;z-index:30;pointer-events:none}
.pcard.active{transform:scale(1.1);box-shadow:0 0 0 4px var(--gold),0 4px 0 var(--edge),0 0 34px var(--gold)}
.pcard .ptag{position:absolute;bottom:-.75em;left:calc(var(--h) * .5);transform:translateX(-50%);background:var(--gold);border:2px solid var(--edge);font-family:var(--display);font-size:.62em;padding:0 9px;border-radius:8px;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:2}
.pcard.right .ptag{left:auto;right:calc(var(--h) * .5);transform:translateX(50%)}
.pcard.active .ptag{opacity:1}
.pcard.off{opacity:.55}

<script type="text/plain" id="rt-nucleo">/* =====================================================================
   NÚCLEO — usado pelo jogo, pelo ADM ao vivo e pela engine
   (regras do roteiro, corações, conexão Firebase/trava ou modo local)
   ===================================================================== */
(function(){
'use strict';
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const other=p=>p==='p1'?'p2':'p1';
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- roteiro ---------- */
function derive(cfg,round){
  let cur=cfg.start,streak=0;
  const chain=[Object.assign({},cfg.start,{res:'start'})];
  for(let j=0;j<round&&j<cfg.steps.length;j++){
    const s=cfg.steps[j];
    chain.push(Object.assign({},s,{res:s.result}));
    if(s.result==='ganha'){cur=s;streak++;}
  }
  return {cur,streak,chain};
}
/* corações: cada erro tira 1; "perde" tira todos. lives 0 = sem corações */
function hearts(cfg,upto){
  const L=Math.max(0,Number(cfg.lives)||0),h={p1:L,p2:L};
  for(let j=0;j<upto&&j<cfg.steps.length;j++){const s=cfg.steps[j];
    if(s.result==='erra')h[s.player]=Math.max(0,h[s.player]-1);else if(s.result==='perde')h[s.player]=0;}
  return h;
}
/* resultado real da rodada r: um erro que zera os corações vira derrota */
function outcome(cfg,r){
  const s=cfg.steps[r];if(!s)return null;
  if(s.result==='ganha')return'ganha';if(s.result==='perde')return'perde';
  if(Number(cfg.lives)>0&&hearts(cfg,r+1)[s.player]<=0)return'perde';
  return'erra';
}
function heartsCheck(cfg){
  const L=Number(cfg.lives)||0,err={p1:0,p2:0};let endAt=-1;
  for(let j=0;j<cfg.steps.length;j++){const s=cfg.steps[j];if(s.result!=='ganha')err[s.player]++;if(outcome(cfg,j)==='perde'){endAt=j;break;}}
  return{lives:L,err,endAt,loser:endAt>=0?cfg.steps[endAt].player:null,total:cfg.steps.length};
}

/* ---------- conexão ---------- */
function firebaseBackend(root){
  const db=firebase.database(),auth=firebase.auth();
  let offset=0;
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0;});
  const R=p=>db.ref(root+(p?'/'+p:''));
  return{
    mode:'firebase',db,auth,root,
    on(path,cb){const r=R(path);const h=s=>cb(s.val());r.on('value',h,e=>console.warn('[sem acesso]',path,e&&e.code));return()=>r.off('value',h);},
    get(path){return R(path).get().then(s=>s.val());},
    set(path,v){return R(path).set(v===undefined?null:clone(v));},
    update(path,v){return R(path).update(clone(v));},
    remove(path){return R(path).remove();},
    tx(path,fn){return R(path).transaction(fn);},
    now(){return Date.now()+offset;},
    uid(){return auth.currentUser?auth.currentUser.uid:'';},
    ensureUser(){
      return new Promise(res=>{
        auth.onAuthStateChanged(u=>{if(u)res(u);else auth.signInAnonymously().catch(e=>console.error(e));});
      });
    }
  };
}
function localBackend(key,mem){
  const K='oqg2-local-'+(key||'jogo');
  let ch=null;if(!mem){try{ch=('BroadcastChannel' in window)?new BroadcastChannel(K):null;}catch(e){ch=null;}}
  let memTree={};
  const read=()=>{if(mem)return memTree;try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return memTree;}};
  let tree=read();const subs=[];
  const parts=p=>String(p||'').split('/').filter(Boolean);
  const getP=(t,p)=>{const v=parts(p).reduce((o,k)=>o==null?null:o[k],t);return v===undefined?null:v;};
  function setP(t,p,v){
    const ps=parts(p);if(!ps.length){return clone(v)||{};}
    let o=t;
    for(let i=0;i<ps.length-1;i++){if(typeof o[ps[i]]!=='object'||o[ps[i]]===null)o[ps[i]]={};o=o[ps[i]];}
    const k=ps[ps.length-1];
    if(v==null)delete o[k];else o[k]=clone(v);
    return t;
  }
  function fire(){subs.forEach(s=>{const j=JSON.stringify(getP(tree,s.path));if(j!==s.last){s.last=j;s.cb(JSON.parse(j));}});}
  function commit(){memTree=tree;if(!mem){try{localStorage.setItem(K,JSON.stringify(tree));}catch(e){}}if(ch)ch.postMessage(1);fire();}
  const refresh=()=>{tree=read();fire();};
  if(ch)ch.onmessage=refresh;
  if(!mem)window.addEventListener('storage',e=>{if(e.key===K)refresh();});
  let bid='';try{bid=localStorage.getItem('oqg2-browser')||'';if(!bid){bid='local-'+newId();localStorage.setItem('oqg2-browser',bid);}}catch(e){bid='local-'+newId();}
  return{
    mode:'local',
    on(path,cb){const s={path,cb,last:undefined};subs.push(s);setTimeout(()=>{s.last=JSON.stringify(getP(tree,path));cb(getP(tree,path));},0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};},
    get(path){return Promise.resolve(clone(getP(tree,path)));},
    set(path,v){tree=read();tree=setP(tree,path,v);commit();return Promise.resolve();},
    update(path,obj){tree=read();for(const k in obj)tree=setP(tree,(path?path+'/':'')+k,obj[k]);commit();return Promise.resolve();},
    remove(path){tree=read();tree=setP(tree,path,null);commit();return Promise.resolve();},
    tx(path,fn){tree=read();const v=fn(clone(getP(tree,path)));if(v!==undefined){tree=setP(tree,path,v);commit();}return Promise.resolve({committed:v!==undefined});},
    now(){return Date.now();},
    uid(){return bid;},
    ensureUser(){return Promise.resolve({uid:bid,isAnonymous:true});}
  };
}
/* memória pura (teste dentro da engine) */
function memoryBackend(){return localBackend('mem',true);}
/* Decide a conexão: com a trava do site principal -> Firebase único "jogos-github";
   sem trava (arquivo aberto do PC, localhost) -> modo local entre abas. */
async function connect(site,opts){
  opts=opts||{};
  if(opts.forceLocal)return localBackend(site);
  const q=new URLSearchParams(location.search);
  if(q.has('local'))return localBackend(site);
  let ok=false;
  if(window.Trava&&window.Trava.ready){
    try{const t=await window.Trava.ready;ok=!!(t&&window.firebase&&firebase.apps&&firebase.apps.length);}catch(e){ok=false;}
  }else if(window.firebase&&window.OQG_FIREBASE&&/^https?:/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname)){
    /* sem trava, mas publicado: usa a config reserva */
    try{if(!firebase.apps.length)firebase.initializeApp(window.OQG_FIREBASE);ok=true;}catch(e){ok=false;}
  }
  if(!ok)return localBackend(site);
  const root=window.DB_ROOT||('sites/'+site);
  return firebaseBackend(root);
}
/* navegador da equipe: avisa a Central quais pastas os jogadores podem gravar */
async function registerWrites(be,site,nodes){
  if(be.mode!=='firebase'||!window.Trava||!window.Trava.admin||!site)return;
  try{
    const ref=be.db.ref('controle/sites/'+site);
    const cur=(await ref.once('value')).val();
    const esc={};nodes.forEach(n=>esc[n]=true);
    if(!cur)await ref.set({open:false,escrita:esc,t:firebase.database.ServerValue.TIMESTAMP});
    else{const miss=nodes.filter(n=>!(cur.escrita&&cur.escrita[n]));for(const n of miss)await ref.child('escrita/'+n).set(true);}
  }catch(e){console.warn('controle',e);}
}

/* ---------- controle da partida ---------- */
function startGame(be,round){
  round=round||0;
  return be.tx('game',g=>({status:'playing',round,phase:'ask',typed:'',revealAt:0,seq:((g&&g.seq)||0)+1}));
}
function toLobby(be){return be.tx('game',g=>({status:'lobby',round:0,phase:'ask',typed:'',revealAt:0,seq:((g&&g.seq)||0)+1}));}
function advance(be,cfg,expect){
  const now=be.now();
  return be.tx('game',g=>{
    if(g===null)return null;
    if(!g||g.status!=='playing')return;
    if(expect&&(g.round!==expect.round||g.phase!==expect.phase))return;
    const st=cfg.steps[g.round];const seq=(g.seq||0)+1;
    if(!st)return Object.assign({},g,{status:'end',seq});
    if(g.phase==='ask')return Object.assign({},g,{phase:'reveal',typed:st.name,revealAt:now,seq});
    if(outcome(cfg,g.round)==='perde'||g.round>=cfg.steps.length-1)return Object.assign({},g,{status:'end',seq});
    return Object.assign({},g,{round:g.round+1,phase:'ask',typed:'',revealAt:0,seq});
  });
}
function redoRound(be){
  return be.tx('game',g=>{if(g===null)return null;if(!g)return;return Object.assign({},g,{status:'playing',phase:'ask',typed:'',revealAt:0,seq:(g.seq||0)+1});});
}

/* ---------- mídias ---------- */
const assetUrl=ref=>{
  if(!ref)return'';const A=window.OQG_ASSETS||{};
  if(typeof ref==='string'&&ref.indexOf('asset:')===0)return A[ref.slice(6)]||'';
  return ref;
};
function readDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file);});}
async function resizeImage(file,max){
  const src=await readDataURL(file);
  return new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let u=c.toDataURL('image/webp',.85);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/png');res(u);};im.src=src;});
}

window.OQG=Object.assign(window.OQG||{},{clone,esc,other,newId,derive,hearts,outcome,heartsCheck,
  connect,localBackend,memoryBackend,registerWrites,startGame,toLobby,advance,redoRound,assetUrl,readDataURL,resizeImage,
  ESCRITA:['players','game','presenca']});
})();
</script>
<script type="text/plain" id="rt-jogo">/* =====================================================================
   JOGO — "O que ganha de...?" (tela fixa 1920x1080, escala para caber)
   window.OQG_MODO: 'jogo' (site) | 'preview' (dentro da engine) | 'teste' (engine, sem internet)
   ===================================================================== */
(function(){
'use strict';

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.1,type='sine',v=.15,slide=0,delay=0){
  if(!soundOn())return;const a=ac();if(!a)return;const t=a.currentTime+delay;v*=num(cfg.sfxVolume,1);
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(Math.max(.0002,v),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}

function playRef(ref,vol=1){
  if(!soundOn()||!ref)return false;const url=O.assetUrl(ref);if(!url)return false;
  try{const a=new Audio(url);a.volume=Math.max(0,Math.min(1,vol*num(cfg.sfxVolume,1)));a.play().catch(()=>{});return true;}catch(e){return false;}
}
function sfx(name){

  if(s.mudo)return;
  if(s.arq&&playRef(s.arq,num(s.vol,1)))return;
  const p=s.preset||name;if(SY[p])SY[p]();
}
let music=null,musicRef='';
function fadeOut(a,ms){if(!a)return;const v0=a.volume,t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=v0*(1-k);if(k<1)requestAnimationFrame(f);else a.pause();};f();}
function fadeIn(a,to,ms){const t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=to*k;if(k<1)requestAnimationFrame(f);};f();}
function wantedMusic(){
  if(!soundOn()||PREVIEW||document.body.classList.contains('gameover'))return'';
  if(screen==='lobby'&&cfg.musicaLobby)return cfg.musicaLobby;
  if(screen==='end'&&cfg.musicaFim)return cfg.musicaFim;
  if(screen!=='game')return'';
  for(let i=shownLevel;i>=1;i--){const m=cfg.levels[i-1]&&cfg.levels[i-1].music;if(m)return m;}return'';
}
function updateMusic(){

  fadeOut(music,1200);music=null;musicRef=ref;if(!ref)return;
  const url=O.assetUrl(ref);if(!url)return;
  const a=new Audio(url);a.loop=true;a.volume=0;music=a;
  a.play().then(()=>fadeIn(a,num(cfg.musicVolume,.5),1500)).catch(()=>{pendingMusic=a;if(!SPECT)$('soundTip').style.display='block';});
}

function bgCss(b){

  if(b.tipo==='cor')return c1;

  if(b.tipo==='imagem'){const u=O.assetUrl(b.img);return u?`${b.escurecer?`linear-gradient(rgba(0,0,0,${num(b.escurecer,0)}),rgba(0,0,0,${num(b.escurecer,0)})),`:''}url("${u}") center/cover no-repeat, ${c1}`:c1;}

}

function spawn(init){
  const p={},pt=PT||{},t=pt.tipo;const cores=String(pt.cores||'').split(/[,\s]+/).filter(Boolean);
  const vel=num(pt.vel,1);
  if(t==='hex'){p.k='hex';p.x=rnd(0,W);p.y=init?rnd(0,H):H+40;p.s=rnd(10,30)*num(pt.tam,1);p.vy=-rnd(.15,.45)*vel;p.r=rnd(0,6);p.vr=rnd(-.004,.004);p.a=rnd(.12,.3);p.c=cores.length?pick(cores):'#ffffff';}
  else if(t==='brasas'){p.k='ember';p.x=rnd(0,W);p.y=init?rnd(0,H):H+10;p.s=rnd(1.5,4)*num(pt.tam,1);p.vy=-rnd(.6,2.6)*vel;p.ph=rnd(0,6);p.c=cores.length?pick(cores):pick(['#ffd24a','#ff7b2e','#ff3d2e','#fff1a8']);}
  else if(t==='emoji'){p.k='emo';p.x=rnd(0,W);p.y=init?rnd(0,H):H+40;p.s=rnd(18,40)*num(pt.tam,1);p.vy=-rnd(.3,1)*vel;p.ph=rnd(0,6);p.r=rnd(-.4,.4);p.e=pick(splitE(pt.emojis).length?splitE(pt.emojis):['✨']);p.a=rnd(.5,.9);p.c=cores.length?pick(cores):'#ffffff';}
  else if(t==='neve'){p.k='snow';p.x=rnd(0,W);p.y=init?rnd(0,H):-10;p.s=rnd(1.5,4.5)*num(pt.tam,1);p.vy=rnd(.4,1.4)*vel;p.ph=rnd(0,6);p.c=cores.length?pick(cores):'#ffffff';}
  else{p.k='star';p.ang=rnd(0,Math.PI*2);p.d=init?rnd(5,Math.max(W,H)*.7):rnd(2,40);p.v=rnd(.4,1.4)*vel;p.s=rnd(.6,2)*num(pt.tam,1);
    p.c=cores.length?pick(cores):pick(['#ffffff','#cdb6ff','#8fd0ff']);}
  return p;
}
function setFx(pt){PT=pt||{};parts=[];if(!PT.tipo||PT.tipo==='nenhuma')return;const n=Math.round(num(PT.qtd,40)*(RM?.25:1));for(let i=0;i<n;i++)parts.push(spawn(true));}
const EMOJIF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace';
function hexPath(x,y,s,r){cx.beginPath();for(let i=0;i<6;i++){const a=r+i*Math.PI/3;cx.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);}cx.closePath();}
function loop(){
  cx.clearRect(0,0,W,H);const cxm=W/2,cym=H*.48;
  for(let i=0;i<parts.length;i++){let p=parts[i];
    if(p.k==='hex'){p.y+=p.vy;p.r+=p.vr;if(p.y<-40)p=parts[i]=spawn(false);cx.strokeStyle=p.c;cx.globalAlpha=p.a;cx.lineWidth=3;hexPath(p.x,p.y,p.s,p.r);cx.stroke();cx.globalAlpha=1;}
    else if(p.k==='ember'){p.y+=p.vy;p.ph+=.05;p.x+=Math.sin(p.ph)*.6;if(p.y<-10)p=parts[i]=spawn(false);cx.fillStyle=p.c;cx.globalAlpha=.85;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.globalAlpha=1;}
    else if(p.k==='snow'){p.y+=p.vy;p.ph+=.03;p.x+=Math.sin(p.ph)*.5;if(p.y>H+10)p=parts[i]=spawn(false);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.globalAlpha=1;}
    else if(p.k==='emo'){p.y+=p.vy;p.ph+=.03;p.x+=Math.sin(p.ph)*.5;if(p.y<-50)p=parts[i]=spawn(false);cx.globalAlpha=p.a;cx.font=`${p.s}px ${EMOJIF}`;cx.textAlign='center';cx.fillStyle=p.c||'#fff';cx.fillText(p.e,p.x,p.y);cx.globalAlpha=1;}
    else{const d0=p.d;p.v*=1.012;p.d+=p.v;const x0=cxm+Math.cos(p.ang)*d0,y0=cym+Math.sin(p.ang)*d0,x1=cxm+Math.cos(p.ang)*p.d,y1=cym+Math.sin(p.ang)*p.d;
      if(x1<-20||x1>W+20||y1<-20||y1>H+20){parts[i]=spawn(false);continue;}
      cx.strokeStyle=p.c;cx.globalAlpha=Math.min(1,p.d/120);cx.lineWidth=p.s;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();cx.globalAlpha=1;}
  }
  requestAnimationFrame(loop);
}

    try{list.push(el.animate(frames,{duration:dur/sp,delay:t0/sp,fill:'both'}));}catch(e){console.warn('animação inválida',e);}
  });

    pb.innerHTML=`<div class="hexph"><div class="ph-in"></div></div><span>${fill(cfg.passText,{jogador:pName(to)})}</span>`;
    paintPhoto(pb.querySelector('.ph-in'),to);pb.style.display='flex';
    if(!instant){sfx('whoosh');pb.animate([{transform:'translateX(60vw)',opacity:0},{transform:'translateX(-5%)',opacity:1,offset:.7},{transform:'translateX(0)',opacity:1}],{duration:700,delay:600,easing:'cubic-bezier(.3,1.3,.5,1)',fill:'both'});}
  }else{
    setVerdict(fill(step.phrase,{vencedor:cur.name,perdedor:step.name}),step.sub,'lose');
    if(!instant)heartBreak(step.player);
    gameOverFx(step,instant);
  }
  hud(r,true);busy=false;resultShown=true;
  const last=oc==='perde'||r>=cfg.steps.length-1;
  if(mySlot()&&!SPECT){$('nextBtn').classList.add('show');$('game').classList.add('resultado');}
  $('nextBtn').textContent=last?(cfg.endLabel||'Ver final'):(cfg.nextLabel||'Próximo');
  if(PREVIEW)return;
  /* quem acabou de responder conduz o avanço automático */
  if(mySlot()===step.player&&!SPECT){
    const an=AJ.autoNext!=null&&AJ.autoNext!==''?num(AJ.autoNext,0):num(tempo('autoNext'),0);
    const delay=oc==='perde'?num(tempo('loseDelay'),4)*1000:an*1000;
    if(delay>0)autoT=setTimeout(()=>{if(t===tok)O.advance(be,cfg,{round:r,phase:'reveal'});},instant?Math.min(delay,1500):delay);
  }
}
function gameOverFx(step,instant){
  const loser=step.player,winner=O.other(loser);
  document.body.classList.add('gameover');updateMusic();
  $('c-'+winner).classList.add('crowned');
  const lc=$('c-'+loser);
  const gt=$('goText');gt.innerHTML=fill(cfg.loseText,{perdedor:pName(loser),vencedor:pName(winner)});
  if(instant){gt.style.opacity=1;return;}
  sfx('perda');flash(1);shake(18);
  lc.animate([{transform:'none'},{transform:'translateX(-8px) rotate(-4deg)',offset:.1},{transform:'translateX(8px) rotate(4deg)',offset:.2},{transform:'translateX(-6px)',offset:.3},{transform:'translateY(0) rotate(0)',filter:'grayscale(1)',offset:.45},{transform:'translateY(1200px) rotate(35deg)',filter:'grayscale(1)'}],{duration:2200,delay:500,easing:'ease-in',fill:'forwards'});
  gt.animate([{opacity:0,transform:'translateY(-600px) rotate(-8deg)'},{opacity:1,transform:'translateY(0) rotate(3deg)',offset:.6},{opacity:1,transform:'translateY(-14px) rotate(-2deg)',offset:.8},{opacity:1,transform:'none'}],{duration:1100,delay:700,easing:'ease-out',fill:'forwards'});
  setTimeout(()=>{SY.boom();shake(12);},1350);
}
function renderEnd(){
  if(!G)return;
  const r=Math.max(0,Math.min(G.round||0,cfg.steps.length-1));const last=cfg.steps[r];
  const dv=O.derive(cfg,r+1);
  let winner=null,loser=null;
  if(last&&O.outcome(cfg,r)==='perde'){loser=last.player;winner=O.other(loser);}else if(last){winner=last.player;loser=O.other(winner);}
  const wn=winner?pName(winner):'',ln=loser?pName(loser):'';
  setLevel(last?last.level:1,false);
  $('eTitle').textContent=cfg.endTitle||'';
  $('eText').innerHTML=fill(cfg.endText,{vencedor:wn,perdedor:ln,final:dv.cur.name,n:String(dv.streak)});
  if(winner)paintPhoto($('eWin').querySelector('.ph-in'),winner);
  $('eWinName').textContent=wn?'🏆 '+wn:'';$('eWinName').style.display=wn?'':'none';
  $('eLose').innerHTML=loser?`<div class="hexph"><div class="ph-in"></div></div><span>💀 ${esc(ln)}</span>`:'';
  if(loser)paintPhoto($('eLose').querySelector('.ph-in'),loser);
  renderChain($('eChain'),dv.chain);
}

/* ---------------- digitação ---------------- */
function target(){return (G&&cfg.steps[G.round]&&cfg.steps[G.round].name)||'';}
const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const freeMode=()=>(AJ.typingMode||cfg.typingMode)==='livre';
inp.addEventListener('input',()=>{
  if(!myTurn()||PREVIEW){inp.value=(G&&G.typed)||'';return;}
  const before=typed;
  if(freeMode()){typed=inp.value.slice(0,40);}
  else{
    const t=[...target()],v=[...inp.value];let n=[...typed].length;
    if(v.length>n)n=Math.min(t.length,v.length);else if(v.length<n)n=Math.max(0,v.length);
    typed=t.slice(0,n).join('');inp.value=typed;
    try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){}
  }
  if(typed!==before){if(typed.length>before.length)sfx('tecla');be.update('game',{typed}).catch(()=>{});}
});
function submit(){
  if(!myTurn()||PREVIEW)return;
  const ok=freeMode()?norm(typed)===norm(target()):typed===target();
  if(!ok){inp.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250});return;}
  O.advance(be,cfg,{round:G.round,phase:'ask'});
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
$('sendBtn').addEventListener('click',e=>{e.currentTarget.blur();submit();});
function nextClick(){if(resultShown&&G&&G.status==='playing'&&!PREVIEW)O.advance(be,cfg,{round:G.round,phase:'reveal'});}
$('nextBtn').addEventListener('click',e=>{e.currentTarget.blur();nextClick();});
arena.addEventListener('click',()=>{if(editOn)return;if(myTurn())inp.focus();else if(mySlot()&&!SPECT)nextClick();});
document.addEventListener('keydown',e=>{
  if(screen!=='game'||e.target===inp||PREVIEW)return;
  if(e.target.closest&&e.target.closest('input,textarea,button,select'))return;
  if((e.key===' '||e.key==='Enter')&&resultShown&&mySlot()&&!SPECT){e.preventDefault();nextClick();}
  else if(myTurn()&&e.key.length===1){inp.focus();}
});
$('soundTip').onclick=unlock;

/* =====================================================================
   EDIÇÃO (só dentro da engine): arrastar/redimensionar caixas
   ===================================================================== */
let editOn=false,editSel='';
const NOMES={ltitle:'Título',lsub:'Subtítulo',slots:'Vagas',lbuttons:'Botões',lhint:'Dica',p1:'Jogador 1',p2:'Jogador 2',counter:'Contador',level:'Fase',
  verdict:'Pergunta / veredito',sub:'Texto de baixo',arena:'Arena',pass:'Aviso "passou a vez"',answer:'Caixa de resposta',send:'Botão Enviar',chain:'Corrente',next:'Botão Próximo',
  ewin:'Vencedor',etitle:'Título final',etext:'Texto final',elose:'Perdedor',echain:'Corrente final',lvintro:'Aviso de fase',gotext:'Texto de derrota'};
function drawEdit(){
  const lay=$('editLayer');lay.innerHTML='';
  const cam=cfg.camera||{};
  if(cam.mostrar!==false&&cam.w){const c=document.createElement('div');c.className='cam';Object.assign(c.style,{left:cam.x+'px',top:cam.y+'px',width:cam.w+'px',height:cam.h+'px'});c.innerHTML='<span>📷 espaço da câmera (não aparece no jogo)</span>';lay.appendChild(c);}
  const scr=document.querySelector('.screen.on');
  const ids=[...scr.querySelectorAll('[data-l]')].map(e=>e.dataset.l).concat(screen==='game'?['lvintro','gotext']:[]);
  ids.sort((a,b)=>{const A=(cfg.layout||{})[a]||{},B=(cfg.layout||{})[b]||{};return(B.w*B.h)-(A.w*A.h);});
  ids.forEach(id=>{
    const b=(cfg.layout||{})[id];if(!b)return;
    const d=document.createElement('div');d.className='eb'+(id===editSel?' sel':'')+(b.vis===false?' off':'');d.dataset.id=id;
    Object.assign(d.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});
    d.innerHTML=`<span class="lb">${esc(NOMES[id]||id)}</span><span class="rz"></span>`;
    lay.appendChild(d);
  });
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(!editOn)return;const eb=e.target.closest('.eb');if(!eb)return;
  e.preventDefault();const id=eb.dataset.id,b=Object.assign({},cfg.layout[id]);
  editSel=id;parent.postMessage({t:'sel',id},'*');
  drag={id,b,x0:e.clientX,y0:e.clientY,rz:e.target.classList.contains('rz'),el:eb};
  document.querySelectorAll('.eb').forEach(x=>x.classList.toggle('sel',x===eb));
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=(e.clientX-drag.x0)/SCALE,dy=(e.clientY-drag.y0)/SCALE;const g=e.shiftKey?1:10,sn=v=>Math.round(v/g)*g;
  const nb=Object.assign({},drag.b);
  if(drag.rz){nb.w=Math.max(20,sn(drag.b.w+dx));nb.h=Math.max(16,sn(drag.b.h+dy));}else{nb.x=sn(drag.b.x+dx);nb.y=sn(drag.b.y+dy);}
  cfg.layout[drag.id]=nb;drag.nb=nb;applyLayoutOne(drag.id);
  Object.assign(drag.el.style,{left:nb.x+'px',top:nb.y+'px',width:nb.w+'px',height:nb.h+'px'});
});
document.addEventListener('pointerup',()=>{if(!drag)return;if(drag.nb)parent.postMessage({t:'layout',id:drag.id,box:drag.nb},'*');drag=null;});
function applyLayoutOne(id){const el=document.querySelector(`[data-l="${id}"]`);const b=cfg.layout[id];if(!el||!b)return;
  el.style.left=b.x+'px';el.style.top=b.y+'px';el.style.width=b.w+'px';el.style.height=b.h+'px';el.style.setProperty('--h',b.h+'px');}

/* =====================================================================
   PRÉVIA (engine): a engine manda a config e o que mostrar
   ===================================================================== */
let VIEW=null,kfDrag=null,animEdit=null;
function fakePlayers(){P={};['p1','p2'].forEach(s=>{P[s]={name:cfg.players[s].name};});}
async function previewView(v){
  VIEW=v;animEdit=null;att.classList.remove('kfdrag');def.classList.remove('kfdrag');
  fakePlayers();cfgReady=true;lastKey='';renderPlayers();
  if(v.tela==='lobby'){G={status:'lobby',round:0,phase:'ask',seq:Date.now()};renderState();}
  else if(v.tela==='fim'){const r=Math.min(cfg.steps.length-1,num(v.round,cfg.steps.length-1));G={status:'end',round:r,phase:'reveal',seq:Date.now()};renderState();}
  else if(v.tela==='anim'){
    const r=Math.max(0,Math.min(cfg.steps.length-1,num(v.round,0)));G={status:'playing',round:r,phase:'ask',seq:Date.now()};renderState();
    const step=cfg.steps[r];const{cur}=O.derive(cfg,r);
    $('verdict').innerHTML=question(cur);$('sub').textContent='';
    setEnt(def,cur);setEnt(att,step);att.style.opacity=1;
    animEdit=v;
    if(v.play){const an=v.anim;const t0=performance.now();const sp=SPD()*num(v.vel,1);const dur=animDur(an)/sp;
      const tick=()=>{if(animEdit!==v)return;const e=(performance.now()-t0);parent.postMessage({t:'animT',t:Math.min(e*sp,animDur(an))},'*');if(e<dur+50)requestAnimationFrame(tick);};
      requestAnimationFrame(tick);
      await playAnim(an,{vel:v.vel});if(animEdit!==v)return;
      if(v.final){const win=v.res!=='erra';const fim=an.fim||(win?'centro':'ficar');if(fim==='centro')await toChamp(win?att:def);}
      parent.postMessage({t:'animEnd'},'*');
    }else{
      await playAnim(v.anim,{seek:num(v.at,0)});
      if(v.sel){const el=v.sel.track==='def'?def:att;el.classList.add('kfdrag');}
    }
  }else{
    const r=Math.max(0,Math.min(cfg.steps.length-1,num(v.round,0)));
    if(v.fase==='play'){G={status:'playing',round:r,phase:'ask',seq:Date.now()};renderState();await sleep(400);
      G={status:'playing',round:r,phase:'reveal',seq:Date.now()+1,revealAt:Date.now()};lastKey='';renderState();}
    else if(v.fase==='result'){G={status:'playing',round:r,phase:'reveal',seq:Date.now(),instant:true};renderState();}
    else{G={status:'playing',round:r,phase:'ask',seq:Date.now(),typed:v.typed?cfg.steps[r].name.slice(0,Math.ceil(cfg.steps[r].name.length/2)):''};renderState();inp.value=G.typed;}
  }
}
/* arrastar o item no keyframe selecionado */
document.addEventListener('pointerdown',e=>{
  if(!PREVIEW||!animEdit||!animEdit.sel)return;const el=e.target.closest('.kfdrag');if(!el)return;
  e.preventDefault();const k=animEdit.sel.kf||{};kfDrag={x0:e.clientX,y0:e.clientY,kx:num(k.x,0),ky:num(k.y,0),el};
});
document.addEventListener('pointermove',e=>{
  if(!kfDrag)return;const dx=(e.clientX-kfDrag.x0)/SCALE,dy=(e.clientY-kfDrag.y0)/SCALE;
  kfDrag.nx=Math.round(kfDrag.kx+dx);kfDrag.ny=Math.round(kfDrag.ky+dy);
  kfDrag.el.getAnimations().forEach(a=>a.cancel());const k=Object.assign({},animEdit.sel.kf,{x:kfDrag.nx,y:kfDrag.ny});
  kfDrag.el.style.transform=kfT(k);kfDrag.el.style.opacity=nz(k.o,1);
});
document.addEventListener('pointerup',()=>{if(!kfDrag)return;if(kfDrag.nx!=null)parent.postMessage({t:'kf',track:animEdit.sel.track,i:animEdit.sel.i,x:kfDrag.nx,y:kfDrag.ny},'*');kfDrag=null;});

function setCfg(c,assets){
  cfg=c;if(assets)window.OQG_ASSETS=assets;
  applyAll();
}
if(PREVIEW){
  window.addEventListener('message',e=>{
    const m=e.data||{};
    if(m.t==='cfg'){setCfg(m.cfg,m.assets);if(VIEW&&!m.semRedesenho&&VIEW.tela!=='anim')previewView(VIEW);}
    else if(m.t==='view'){previewView(m.v);}
    else if(m.t==='edit'){editOn=!!m.on;editSel=m.sel||'';document.body.classList.toggle('editando',editOn);if(editOn)drawEdit();}
    else if(m.t==='mute'){cfg.sound=!m.on;}
    else if(m.t==='som'){unlock();if(m.arq){if(!playRef(m.arq,num(m.vol,1))&&SY[m.preset])SY[m.preset]();}else if(SY[m.preset])SY[m.preset]();}
    else if(m.t==='stop'){animEdit=null;stopAnim();}
  });
  document.body.classList.add('preview');
  cfgReady=true;applyAll();fakePlayers();
  parent.postMessage({t:'ready'},'*');
  return;
}

/* =====================================================================
   CONEXÃO
   ===================================================================== */
(async function start(){
  applyAll();cfgReady=true;
  try{tabId=sessionStorage.getItem('oqg2-tab')||'';if(!tabId){tabId=O.newId();sessionStorage.setItem('oqg2-tab',tabId);}mySlotV=sessionStorage.getItem('oqg2-slot')||null;}catch(e){tabId=O.newId();}
  if(SPECT)mySlotV=null;
  if(TESTE){
    be=O.memoryBackend();await be.ensureUser();myUid='teste';myId='teste';
    await be.set('players',{p1:{name:cfg.players.p1.name,client:'teste',seen:Date.now()},p2:{name:cfg.players.p2.name,client:'teste',seen:Date.now()}});
    mySlotV='p1';
  }else{
    be=await O.connect(SITE);
    await be.ensureUser();myUid=be.uid();myId=myUid+'_'+tabId;
    if(be.mode==='local'&&!SPECT){const b=$('modeBadge');b.hidden=false;b.textContent='Modo teste local: abra outra aba para o 2º jogador e ADM/ para o painel';}
    O.registerWrites(be,SITE,O.ESCRITA);
  }
  be.on('players',p=>{P=p||{};P._loaded=true;renderPlayers();});
  be.on('game',g=>{G=g||{status:'lobby',round:0,phase:'ask',seq:0};renderState();});
  if(TESTE)return;
  be.on('ajustes',a=>{AJ=a||{};renderPlayers();});
  /* config ao vivo: o ADM publica e todo mundo atualiza na hora */
  const loadedRev={};
  async function loadMedia(c){
    const need=new Set();JSON.stringify(c).replace(/asset:([a-z0-9]+)/g,(m,id)=>{need.add(id);return m;});
    const rev=c.mediaRev||{},A=window.OQG_ASSETS=window.OQG_ASSETS||{};
    await Promise.all([...need].map(async id=>{const r=rev[id]||0;
      if(A[id]&&loadedRev[id]===r)return;
      if(A[id]&&!r&&loadedRev[id]===undefined){loadedRev[id]=0;return;}
      try{const m=await be.get('media/'+id);if(m&&m.data)A[id]=m.data;}catch(e){}loadedRev[id]=r;}));
  }
  let cfgSeq=0;
  be.on('config',async c=>{
    if(!c||typeof c!=='object'||!Array.isArray(c.steps))return;
    const my=++cfgSeq;await loadMedia(c);if(my!==cfgSeq)return;
    cfg=c;applyAll();forceInstant=true;lastKey='';renderState();renderPlayers();
  });
  be.on('banidos',b=>{BAN=b||{};const ban=!!BAN[myUid];$('banned').classList.toggle('on',ban);if(ban&&mySlotV)leave();});
  let rbase;be.on('control/reload',v=>{if(rbase===undefined){rbase=v;return;}if(v!==rbase)location.reload();});
  setInterval(()=>renderPlayers(),5000);
  setInterval(()=>{if(mySlotV)be.update('players/'+mySlotV,{seen:be.now()}).catch(()=>{});presence();},8000);
  presence();
  if(be.mode==='firebase'){try{be.db.ref(be.root+'/presenca/'+presenceKey()).onDisconnect().remove();}catch(e){}}
  addEventListener('pagehide',()=>{try{be.remove('presenca/'+presenceKey());}catch(e){}});
})();
})();
</script>
<script type="text/plain" id="ed-shell"><!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine · O que ganha de...?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='25,8 75,8 98,50 75,92 25,92 2,50' fill='%2300d0e0' stroke='%23071a2b' stroke-width='6'/><text x='50' y='66' font-size='46' text-anchor='middle'>⚙️</text></svg>">
<style>
:root{--bg:#0d1117;--p1:#151b23;--p2:#1c2430;--p3:#232d3b;--line:#2b3747;--tx:#e6edf3;--mu:#8b9bb0;--ac:#1ec8e6;--ac2:#ff3d9a;--ok:#2fd27b;--warn:#ffb020;--bad:#ff5c6c;--gold:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--p1);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;margin-right:8px;white-space:nowrap}.brand b{color:var(--ac)}
#status{color:var(--mu);font-size:12px;margin-right:auto;white-space:nowrap}
.btn{background:var(--p3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;white-space:nowrap}

.btn:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.btn.pri{background:var(--ac);color:#03222a;border-color:var(--ac)}
.btn.hot{background:var(--gold);color:#2a2000;border-color:var(--gold)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
#body{display:grid;grid-template-columns:440px 1fr;min-height:0}
aside{display:flex;flex-direction:column;min-height:0;background:var(--p1);border-right:1px solid var(--line)}

#tabs button:hover{color:var(--tx)}
#tabs button.on{background:var(--p3);border-color:var(--line);color:var(--tx)}

#pvbar select,#tlbar select{background:var(--p3);border:1px solid var(--line);border-radius:7px;padding:4px 6px;width:auto;max-width:260px}
#pvwrap{flex:1;min-height:200px;position:relative;background:repeating-conic-gradient(#11161d 0 25%,#0d1117 0 50%) 0 0/24px 24px;overflow:hidden}
#pvbox{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;box-shadow:0 0 0 1px #ffffff22,0 10px 40px #0008}
#pv{width:1920px;height:1080px;border:0;display:block;background:#000}
#tl{height:0;overflow:hidden;background:var(--p1);border-top:1px solid var(--line);display:flex;flex-direction:column}
#tl.on{height:290px}
h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac)}
h3:first-child{margin-top:2px}
.note{color:var(--mu);font-size:12px;margin:4px 0 8px}
.warn{background:#3a2b08;border:1px solid #8a6514;color:#ffd98a;border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
.okbox{background:#0b2d1c;border:1px solid #1d7a4a;color:#9df0c4;border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
.f{display:grid;grid-template-columns:128px 1fr;align-items:center;gap:6px;margin:4px 0}
.f>label{color:var(--mu);font-size:12px}
.f.wide{grid-template-columns:1fr}
.f.wide>label{margin-bottom:-2px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{min-height:54px;resize:vertical}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;flex:none;cursor:pointer}
input[type=range]{width:100%}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.row>input[type=text]{flex:1;width:auto}
.grow{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini{display:flex;flex-direction:column;gap:2px}
.mini>label{color:var(--mu);font-size:11px}
.card{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;margin:4px 0}
.list .it{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;margin:3px 0;background:var(--p2);cursor:pointer}
.list .it:hover{border-color:var(--ac)}
.list .it.sel{border-color:var(--ac2);background:#2a1630}
.it .n{width:24px;text-align:right;color:var(--mu);font-weight:700;flex:none}
.it .th{width:30px;height:30px;display:grid;place-items:center;font-size:21px;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it .th img{width:100%;height:100%;object-fit:contain}
.it .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sm{color:var(--mu);font-size:11px;white-space:nowrap}
.tag{display:inline-block;padding:0 6px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.tag.ganha{color:var(--ok)}.tag.erra{color:var(--warn)}.tag.perde{color:var(--bad)}.tag.vitoria{color:var(--ok)}.tag.erro{color:var(--warn)}.tag.especial{color:var(--ac)}
.stepedit{border:1px solid var(--ac2);border-radius:10px;padding:8px;margin:2px 0 8px;background:#1d1424}
.assetbox{display:flex;align-items:center;gap:6px}
.assetbox .pv{width:34px;height:34px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--mu);flex:none;background:#0004}
.assetbox .pv img{width:100%;height:100%;object-fit:contain}
.assetbox .nmx{flex:1;min-width:0;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.lib .a{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.lib .a:hover{border-color:var(--ac)}
.lib .a .im{height:70px;display:grid;place-items:center;background:#0005;border-radius:5px;overflow:hidden;font-size:26px}
.lib .a .im img{max-width:100%;max-height:100%;object-fit:contain}
.lib .a .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .a .x{position:absolute;right:3px;top:3px;background:#000a;border:0;border-radius:5px;color:var(--bad);cursor:pointer;padding:0 5px;display:none}
.lib .a:hover .x{display:block}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--mu);margin:6px 0}
.drop.over{border-color:var(--ac);color:var(--ac)}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100;padding:20px}
.modal.on{display:grid}
.mbox{background:var(--p1);border:1px solid var(--line);border-radius:14px;max-width:min(1100px,100%);max-height:100%;overflow:auto;padding:14px 16px;width:100%}
.mbox h2{margin:0 0 8px;font-size:17px}
#testbox{width:100%;height:100%;display:flex;flex-direction:column;gap:8px}
#testfr{flex:1;border:0;border-radius:10px;background:#000;width:100%}
/* timeline */
#tlbar{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlbar .t{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;min-width:64px}
#tlmain{flex:1;display:grid;grid-template-columns:150px 1fr;min-height:0}
#tlnames{border-right:1px solid var(--line)}
#tlnames div,.tlrow{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#tlnames div{padding:0 8px;font-weight:700;color:var(--mu);font-size:12px}
#tlnames div.rul{height:26px}
#tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
#tlin{position:relative;min-width:100%}
.rul{height:26px;position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.rul span{position:absolute;top:4px;font-size:10px;color:var(--mu);transform:translateX(-50%)}
.rul i{position:absolute;bottom:0;width:1px;height:6px;background:var(--line)}
.tlrow{position:relative}
.kf{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--ac);transform:rotate(45deg);border:2px solid #fff3;cursor:ew-resize;border-radius:2px}
.kf.def{background:#ff9a3c}
.kf.sel{background:var(--ac2);border-color:#fff;box-shadow:0 0 0 3px #ff3d9a55}
.kf.stp{border-radius:0;background:#8b9bb0}
.seg{position:absolute;top:50%;height:4px;margin-top:-2px;background:#1ec8e644;border-radius:2px;pointer-events:none}
.seg.def{background:#ff9a3c44}
.evrow{height:84px!important}
.evm{position:absolute;transform:translateX(-50%);background:var(--p3);border:1px solid var(--line);border-radius:6px;padding:0 3px;cursor:ew-resize;font-size:12px;line-height:16px;white-space:nowrap;font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.evm.sel{border-color:var(--ac2);background:#3a1630}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;z-index:5}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--gold)}
.kbd{font-size:11px;color:var(--mu)}
.fav-prev{display:flex;gap:10px;flex-wrap:wrap}
.tabmock{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px 10px 0 0;min-width:200px;font:13px system-ui}
.tabmock img{width:16px;height:16px}
.filelist{font-family:ui-monospace,monospace;font-size:11px;background:#0006;border-radius:8px;padding:8px;max-height:160px;overflow:auto;white-space:pre}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--ac);padding:8px 14px;border-radius:10px;z-index:200;font-weight:600;transition:opacity .3s}
@media (max-width:1100px){#body{grid-template-columns:360px 1fr}.f{grid-template-columns:100px 1fr}}
</style>

<script type="text/plain" id="ed-padrao">/* =====================================================================
   PADRÕES da engine: config inicial, animações e roteiros prontos
   ===================================================================== */
(function(){
'use strict';
/* ---------- construtor de animações (keyframes) ---------- */
const S=.8; /* as animações originais rodavam a 80% do tempo */
const F=(x,y,sx,sy,r,extra)=>Object.assign({x:Math.round(x),y:Math.round(y)},sx!=null&&sx!==1?{sx}:{},sy!=null&&sy!==sx?{sy}:{},r?{r}:{},extra||{});
function TL(nome,tipo,fim){
  const a={nome,tipo,fim,tracks:{att:[],def:[]},events:[]};
  const push=(tr,k)=>{const L=a.tracks[tr],last=L[L.length-1];
    if(last&&last.t===k.t&&JSON.stringify(Object.assign({},last,{e:0}))===JSON.stringify(Object.assign({},k,{e:0}))){if(k.e)last.e=k.e;return;}
    L.push(k);};
  return{
    a,
    A(tr,frames,dur,ease,at){
      dur=dur*S;ease=ease||'cubic-bezier(.2,.8,.2,1)';const n=frames.length;

      return Math.round(at+dur);
    },
    reset(tr,at,fr){const L=a.tracks[tr],last=L[L.length-1];if(last&&last.t<at)last.e='steps(1,end)';const k=Object.assign({},fr,{t:Math.round(at)});push(tr,k);},
    ev(t,tipo,o){a.events.push(Object.assign({t:Math.round(t),tipo},o||{}));},
    ms:v=>v*S
  };
}
const d=320,h=180,sz=200,W=1920,H=520;
const REST=b=>{b.A('att',[F(-d,0)],1,null,0);b.A('def',[F(d,0)],1,null,0);};

function anims(){
  const L={};let b,t;

  b=TL('Entrada (antes de toda rodada)','especial','nenhum');
  b.ev(0,'som',{preset:'whoosh'});
  b.A('def',[F(0,0),F(d,0)],320,null,0);
  b.A('att',[F(-d-600,0,.6,.6,-30),F(-d,0,1.1,1.1,6,{off:.8}),F(-d,0)],400,'cubic-bezier(.2,.9,.3,1.2)',0);
  L.entrada=b.a;

  b.ev(t,'som',{preset:'hit'});b.ev(t,'tremer',{forca:9});b.ev(t,'flash',{forca:.6,nivelMin:4});b.ev(t,'burst',{x:d,y:Math.round(h*.2),emojis:'💥 ⭐ 💨',n:9});

  b=TL('Embrulhar','vitoria','centro');REST(b);

  b.ev(t,'burst',{x:d,y:0,emojis:'✨',n:7});

  t=b.A('att',[F(-d,0),F(d*.15,0,1.2)],450,null,0);b.ev(t,'som',{preset:'hit'});b.ev(t,'som',{preset:'whoosh'});

  const tq=t;

  b=TL('Engolir (espiral)','vitoria','centro');REST(b);
  t=b.A('att',[F(-d,0),F(0,0,1.4)],500,null,0);b.ev(t,'som',{preset:'whoosh'});
  b.A('def',[F(d,0),F(d*.4,-h*.35,.7,.7,300,{off:.5}),F(0,0,.05,.05,720,{o:0})],900,'ease-in',t);
  t=b.A('att',[F(0,0,1.4),F(0,0,1.25),F(0,0,1.5),F(0,0,1.3)],900,null,t);
  b.ev(t,'som',{preset:'hit'});b.ev(t,'tremer',{forca:9});b.ev(t,'flash',{forca:.5,nivelMin:4});
  b.A('att',[F(0,0,1.3),F(0,0,1.7,1.2),F(0,0,1)],460,'cubic-bezier(.3,1.5,.5,1)',t);
  L.engolir=b.a;

  b=TL('Explodir','vitoria','centro');REST(b);
  t=b.A('att',[F(-d,0),F(-d-40,0,.9,1.1,-10,{off:.4}),F(d-60,0,1.1,.95,10)],460,'ease-in',0);
  b.ev(t,'som',{preset:'boom'});b.ev(t,'flash',{forca:.9});b.ev(t,'tremer',{forca:15});b.reset('def',t,F(d,0,1,1,0,{o:0}));
  b.ev(t,'burst',{x:d,y:0,emojis:'💥 🔥 ✨ 💨',n:24,dist:Math.round(h*1.7),tam:[30,72],dur:1050});
  b.A('att',[F(d-60,0,1.1,.95,10),F(d*.3,0)],520,'cubic-bezier(.3,1.4,.5,1)',t);
  L.explodir=b.a;

  b=TL('Desintegrar (glitch)','vitoria','centro');REST(b);
  t=b.A('att',[F(-d,0),F(-d*.4,0,1.2,1.2,-8),F(-d*.4,0,1.15)],380,null,0);
  b.ev(t,'som',{preset:'glitch'});
  const R=rnd(7),gf=[F(d,0,1,1,0,{o:1,f:'hue-rotate(0deg) saturate(1) blur(0px)'})];
  for(let i=0;i<12;i++)gf.push(F(d+(R()*28-14),R()*16-8,+(1+R()*.2-.08).toFixed(2),+(1+R()*.2-.1).toFixed(2),0,{f:`hue-rotate(${Math.round(R()*360)}deg) saturate(${(1+R()*3).toFixed(1)}) blur(0px)`,o:+(.4+R()*.6).toFixed(2)}));

  t=b.A('def',gf,750,'steps(1,end)',t);
  b.ev(t,'som',{preset:'hit'});b.ev(t,'flash',{forca:.4});
  b.ev(t,'burst',{x:d,y:0,poeira:true,n:46,dist:Math.round(h*1.5),jx:Math.round(sz*.8),jy:Math.round(sz*.8),dur:1000});
  t=b.A('def',[F(d,0,1,1,0,{o:1,f:'hue-rotate(0deg) saturate(1) blur(0px)'}),F(d,0,1.4,.05,0,{o:0,f:'hue-rotate(0deg) saturate(1) blur(4px)'})],260,null,t);
  b.A('att',[F(-d*.4,0,1.15),F(-d*.4,0,1.15)],1,null,t-1);

  b=TL('Evaporar (ondas de calor)','vitoria','centro');REST(b);
  t=b.A('att',[F(-d,0),F(-d*.7,0,1.3),F(-d*.7,0,1.15),F(-d*.7,0,1.35)],650,null,0);

  t=b.A('def',[F(d,0,1,1,0,{f:'brightness(1) saturate(1) blur(0px)'}),F(d,0,1.06,.94,-4,{f:'brightness(1.3) saturate(.7) blur(0px)',off:.3}),F(d,0,.94,1.08,4,{off:.55}),F(d,-h*.7,.7,1.25,0,{f:'brightness(2) saturate(0) blur(12px)',o:0})],1500,'ease-in',t);
  b.A('att',[F(-d*.7,0,1.35),F(-d*.7,0,1.35)],1,null,t-1);
  b.A('att',[F(-d*.7,0,1.35),F(-d*.3,0)],380,null,t);
  L.evaporar=b.a;

  b=TL('Pular de susto','vitoria','centro');REST(b);
  t=b.A('att',[F(-d,0),F(-d*.2,0,1.12)],360,null,0);
  b.ev(t,'icone',{emoji:'❗',x:d,y:Math.round(-h*.95),tam:56,dur:520});b.ev(t,'som',{preset:'alarme'});
  t=b.A('def',[F(d,0),F(d,h*.12,1.2,.7)],200,'ease-out',t);
  b.ev(t,'som',{preset:'pulo'});b.ev(t,'burst',{x:d,y:Math.round(h*.35),emojis:'💨',n:5,dist:60,tam:[24,40],dur:600});
  t=b.A('def',[F(d,h*.12,1.2,.7),F(d,-H*.9,.85,1.25,-20)],650,'cubic-bezier(.2,.9,.4,1)',t);
  b.reset('def',t,F(d,-H*.9,.85,1.25,-20,{o:0}));
  b.A('att',[F(-d*.2,0,1.12),F(-d*.2,0,1.12)],1,null,t-1);
  b.A('att',[F(-d*.2,0,1.12),F(0,0)],300,null,t);
  L.pular=b.a;

  b=TL('Ensaboar','vitoria','centro');REST(b);
  t=b.A('att',[F(-d,0),F(d-sz*.35,-sz*.15,1,1,-10)],420,null,0);
  b.ev(t,'burst',{x:d,y:0,emojis:'🫧',n:3,dist:Math.round(sz*.9),tam:[22,46],dur:900,repetir:7,intervalo:150});b.ev(t,'som',{preset:'whoosh'});

function field(obj,path,label,type,opt){
  opt=opt||{};const cur=gp(obj,path);let input;
  const set=(v,final)=>{sp(obj,path,v);if(opt.on)opt.on(v,final);changed(final);};
  const wrapF=(...k)=>h('div',{class:'f'+(opt.wide?' wide':''),title:opt.tip||''},h('label',{},label),...k);
  if(type==='check'){
    input=h('input',{type:'checkbox'});input.checked=opt.inv?!cur:!!cur;
    input.onchange=()=>set(opt.inv?!input.checked:input.checked,true);

  }
  if(type==='area'){input=h('textarea',{placeholder:opt.ph||''});input.value=cur==null?'':cur;input.oninput=()=>set(input.value,false);input.onchange=()=>set(input.value,true);return wrapF(input);}

    input.onchange=()=>{let v=input.value;if(opt.number)v=Number(v);set(v,true);};return wrapF(input);
  }

    const toHex=v=>/^#[0-9a-f]{6}$/i.test(v||'')?v:/^#[0-9a-f]{3}$/i.test(v||'')?'#'+v.slice(1).split('').map(x=>x+x).join(''):'#ffffff';
    cc.value=toHex(cur);cc.oninput=()=>{tx.value=cc.value;set(cc.value,false);};cc.onchange=()=>set(cc.value,true);
    tx.oninput=()=>{cc.value=toHex(tx.value);set(tx.value,false);};tx.onchange=()=>set(tx.value,true);
    return wrapF(h('div',{class:'row'},cc,tx));
  }
  if(type==='num'||type==='sec'||type==='range'){
    const isS=type==='sec';const show=v=>isS?(v==null||v===''?'':fmtS(v)):(v==null?'':v);
    input=h('input',{type:type==='range'?'range':'number',step:opt.step||(isS?.05:1),min:opt.min,max:opt.max,value:show(cur)});
    const read=()=>{if(input.value===''&&opt.blank)return undefined;const v=Number(input.value);return isS?Math.round(v*1000):v;};
    const out=type==='range'?h('span',{style:'min-width:44px;text-align:right'},String(cur)):null;
    input.oninput=()=>{const v=read();if(out)out.textContent=String(v);set(v,false);};input.onchange=()=>set(read(),true);
    return wrapF(out?h('div',{class:'row'},h('div',{class:'grow'},input),out):h('div',{class:'row'},input,isS?h('span',{class:'kbd'},'seg'):opt.unit?h('span',{class:'kbd'},opt.unit):null));
  }
  if(type==='asset'||type==='audio'){
    return wrapF(assetBox(cur,type==='audio'?'audio':'img',v=>{set(v,true);renderPanel();}));
  }
  input=h('input',{type:'text',value:cur==null?'':cur,placeholder:opt.ph||''});

  if(opt.emoji)input.style.fontFamily='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  return wrapF(input);
}

async function addFiles(files,opts){

function readDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file);});}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function shrinkImage(src,max){
  const im=await loadImg(src);if(Math.max(im.width,im.height)<=max)return src;
  const s=max/Math.max(im.width,im.height),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/webp',.9);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/png');return u;
}
/* tira fundo liso (opcional), corta bordas vazias e centraliza num quadrado */
async function processImage(src,opt){
  opt=opt||{};const size=opt.size||360,fill=opt.fill||.9,tol=opt.tol||60;
  const im=await loadImg(src);
  const sc=Math.min(1,800/Math.max(im.width,im.height));
  const w=Math.max(1,Math.round(im.width*sc)),hh=Math.max(1,Math.round(im.height*sc));
  const c=document.createElement('canvas');c.width=w;c.height=hh;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,hh);
  const d=x.getImageData(0,0,w,hh),p=d.data;
  if(opt.removeBg){
    const N=w*hh,seen=new Uint8Array(N),q=new Int32Array(N);let qh=0,qt=0;
    const nbs=k=>{const xx=k%w,yy=(k/w)|0;return[xx>0?k-1:-1,xx<w-1?k+1:-1,yy>0?k-w:-1,yy<hh-1?k+w:-1];};
    const edge=[];
    for(let i=0;i<w;i++){[i,(hh-1)*w+i].forEach(k=>{if(!seen[k]){seen[k]=1;q[qt++]=k;}});}
    for(let j=0;j<hh;j++){[j*w,j*w+w-1].forEach(k=>{if(!seen[k]){seen[k]=1;q[qt++]=k;}});}
    const firstRing=qt;for(let i=0;i<firstRing;i++){const k=q[i];if(p[k*4+3]>=20)edge.push(k);}
    while(qh<qt){const k=q[qh++];if(p[k*4+3]>=20)continue;for(const n of nbs(k)){if(n<0||seen[n])continue;seen[n]=1;if(p[n*4+3]<20)q[qt++]=n;else edge.push(n);}}
    const cnt={};let best=-1,bn=0;
    edge.forEach(k=>{const i=k*4,key=(p[i]>>4)+','+(p[i+1]>>4)+','+(p[i+2]>>4);cnt[key]=(cnt[key]||0)+1;if(cnt[key]>bn){bn=cnt[key];best=k;}});
    if(best>=0){
      const R=p[best*4],Gc=p[best*4+1],B=p[best*4+2];const dist=i=>Math.abs(p[i]-R)+Math.abs(p[i+1]-Gc)+Math.abs(p[i+2]-B);
      const seen2=new Uint8Array(N);qh=0;qt=0;
      edge.forEach(k=>{if(!seen2[k]&&dist(k*4)<tol*1.4){seen2[k]=1;q[qt++]=k;}});
      while(qh<qt){const k=q[qh++],i=k*4,dd=dist(i);
        if(dd<tol){p[i+3]=0;}else{p[i+3]=Math.min(p[i+3],Math.round(255*(dd-tol)/(tol*.4)));continue;}
        for(const n of nbs(k)){if(n<0||seen2[n])continue;const ni=n*4;if(p[ni+3]>=20&&dist(ni)<tol*1.4){seen2[n]=1;q[qt++]=n;}}}
      x.putImageData(d,0,0);
    }
  }
  let x0=w,y0=hh,x1=-1,y1=-1;
  for(let yy=0;yy<hh;yy++)for(let xx=0;xx<w;xx++){if(p[(yy*w+xx)*4+3]>16){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy;}}
  if(x1<0){x0=0;y0=0;x1=w-1;y1=hh-1;}
  const bw=x1-x0+1,bh=y1-y0+1,k=Math.min(size*fill/bw,size*fill/bh);
  const o=document.createElement('canvas');o.width=o.height=size;
  o.getContext('2d').drawImage(c,x0,y0,bw,bh,(size-bw*k)/2,(size-bh*k)/2,bw*k,bh*k);
  let u=o.toDataURL('image/webp',.92);if(u.indexOf('data:image/webp')!==0)u=o.toDataURL('image/png');return u;
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function makeZip(files){
  const enc=new TextEncoder();const parts=[],central=[];let off=0;
  const now=new Date();const dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF,dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data),sz=data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz;
  }
  const cd=central.reduce((a,b)=>a+b.length,0);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cd,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});

async function readZip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('ZIP inválido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={},dec=new TextDecoder();

    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);

    if(name.endsWith('/'))continue;

async function makeFavicon(size){
  const E=P.export,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const sc=size/64,esp=num(E.favEsp,6)*sc;
  /* desenha a figura num canvas separado */
  const fig=document.createElement('canvas');fig.width=fig.height=size;const fx=fig.getContext('2d');
  const pad=E.favBorda==='quadrado'||E.favBorda==='circulo'?size*.2:E.favBorda==='contorno'?esp+2*sc:2*sc;
  const inner=size-pad*2;
  if(E.favFonte==='img'&&assetSrc(E.favImg)){try{const im=await loadImg(assetSrc(E.favImg));const k=Math.min(inner/im.width,inner/im.height);fx.drawImage(im,(size-im.width*k)/2,(size-im.height*k)/2,im.width*k,im.height*k);}catch(e){}}
  else{fx.font=`${Math.round(inner*.86)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;fx.textAlign='center';fx.textBaseline='middle';fx.fillText(E.favEmoji||'🤔',size/2,size/2+inner*.05);}
  if(E.favBorda==='quadrado'||E.favBorda==='circulo'){
    x.beginPath();const r=E.favBorda==='circulo'?size/2-esp/2:size*.22;
    if(E.favBorda==='circulo')x.arc(size/2,size/2,size/2-esp/2,0,Math.PI*2);else{const a=esp/2,b=size-esp/2;x.moveTo(a+r,a);x.arcTo(b,a,b,b,r);x.arcTo(b,b,a,b,r);x.arcTo(a,b,a,a,r);x.arcTo(a,a,b,a,r);x.closePath();}
    if(E.favPreencher){x.fillStyle=E.favCorFundo||'#fff';x.fill();}
    if(esp>0){x.lineWidth=esp;x.strokeStyle=E.favCorBorda||'#000';x.stroke();}
    x.drawImage(fig,0,0);
  }else if(E.favBorda==='contorno'&&esp>0){
    const sil=document.createElement('canvas');sil.width=sil.height=size;const sx=sil.getContext('2d');sx.drawImage(fig,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle=E.favCorBorda||'#000';sx.fillRect(0,0,size,size);
    for(let a=0;a<32;a++){const t=a/32*Math.PI*2;x.drawImage(sil,Math.cos(t)*esp,Math.sin(t)*esp);}
    x.drawImage(fig,0,0);
  }else x.drawImage(fig,0,0);
  return c.toDataURL('image/png');
}

async function importZip(buf){

  let idxName=Object.keys(files).filter(n=>/(^|\/)index\.html$/i.test(n)&&!/(^|\/)ADM\//i.test(n)).sort((a,b)=>a.length-b.length).find(n=>dec.decode(files[n]).indexOf('/*CFG*/')>=0);
  if(!idxName)throw new Error('Não achei o index.html exportado pela engine dentro do ZIP');
  const root=idxName.slice(0,idxName.length-'index.html'.length);const html=dec.decode(files[idxName]);
  const cut=(a,b)=>{const i=html.indexOf(a),j=html.indexOf(b,i);return i>=0&&j>i?html.slice(i+a.length,j):null;};
  const c=JSON.parse(cut('/*CFG*/','/*FIMCFG*/'));const amap=JSON.parse(cut('/*ASSETS*/','/*FIMASSETS*/')||'{}');const exp=JSON.parse(cut('/*EXP*/','/*FIMEXP*/')||'{}');
  const assets={};
  for(const id in amap){const path=root+amap[id];const data=files[path];if(!data)continue;const ext=(path.split('.').pop()||'').toLowerCase();const mime=MIME[ext]||'application/octet-stream';
    assets[id]={nome:(path.split('/').pop()||id).replace(/\.[^.]+$/,''),tipo:mime.indexOf('audio')===0?'audio':'img',mime,data:bytesToData(data,mime)};}
  P=completarProjeto({nome:c.title,cfg:c,assets,export:exp});afterLoad(true);
}

<script>/* =====================================================================

(function(){

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- roteiro ---------- */
function derive(cfg,round){
  let cur=cfg.start,streak=0;
  const chain=[Object.assign({},cfg.start,{res:'start'})];
  for(let j=0;j<round&&j<cfg.steps.length;j++){
    const s=cfg.steps[j];
    chain.push(Object.assign({},s,{res:s.result}));
    if(s.result==='ganha'){cur=s;streak++;}
  }
  return {cur,streak,chain};
}
/* corações: cada erro tira 1; "perde" tira todos. lives 0 = sem corações */
function hearts(cfg,upto){
  const L=Math.max(0,Number(cfg.lives)||0),h={p1:L,p2:L};
  for(let j=0;j<upto&&j<cfg.steps.length;j++){const s=cfg.steps[j];
    if(s.result==='erra')h[s.player]=Math.max(0,h[s.player]-1);else if(s.result==='perde')h[s.player]=0;}
  return h;
}
/* resultado real da rodada r: um erro que zera os corações vira derrota */
function outcome(cfg,r){
  const s=cfg.steps[r];if(!s)return null;
  if(s.result==='ganha')return'ganha';if(s.result==='perde')return'perde';
  if(Number(cfg.lives)>0&&hearts(cfg,r+1)[s.player]<=0)return'perde';
  return'erra';
}
function heartsCheck(cfg){
  const L=Number(cfg.lives)||0,err={p1:0,p2:0};let endAt=-1;
  for(let j=0;j<cfg.steps.length;j++){const s=cfg.steps[j];if(s.result!=='ganha')err[s.player]++;if(outcome(cfg,j)==='perde'){endAt=j;break;}}
  return{lives:L,err,endAt,loser:endAt>=0?cfg.steps[endAt].player:null,total:cfg.steps.length};
}

/* ---------- conexão ---------- */
function firebaseBackend(root){
  const db=firebase.database(),auth=firebase.auth();
  let offset=0;
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0;});
  const R=p=>db.ref(root+(p?'/'+p:''));
  return{
    mode:'firebase',db,auth,root,
    on(path,cb){const r=R(path);const h=s=>cb(s.val());r.on('value',h,e=>console.warn('[sem acesso]',path,e&&e.code));return()=>r.off('value',h);},
    get(path){return R(path).get().then(s=>s.val());},
    set(path,v){return R(path).set(v===undefined?null:clone(v));},
    update(path,v){return R(path).update(clone(v));},
    remove(path){return R(path).remove();},
    tx(path,fn){return R(path).transaction(fn);},
    now(){return Date.now()+offset;},
    uid(){return auth.currentUser?auth.currentUser.uid:'';},
    ensureUser(){
      return new Promise(res=>{
        auth.onAuthStateChanged(u=>{if(u)res(u);else auth.signInAnonymously().catch(e=>console.error(e));});

  };
}
function localBackend(key,mem){
  const K='oqg2-local-'+(key||'jogo');

  let tree=read();const subs=[];
  const parts=p=>String(p||'').split('/').filter(Boolean);
  const getP=(t,p)=>{const v=parts(p).reduce((o,k)=>o==null?null:o[k],t);return v===undefined?null:v;};
  function setP(t,p,v){
    const ps=parts(p);if(!ps.length){return clone(v)||{};}

    for(let i=0;i<ps.length-1;i++){if(typeof o[ps[i]]!=='object'||o[ps[i]]===null)o[ps[i]]={};o=o[ps[i]];}
    const k=ps[ps.length-1];
    if(v==null)delete o[k];else o[k]=clone(v);
    return t;
  }
  function fire(){subs.forEach(s=>{const j=JSON.stringify(getP(tree,s.path));if(j!==s.last){s.last=j;s.cb(JSON.parse(j));}});}
  function commit(){memTree=tree;if(!mem){try{localStorage.setItem(K,JSON.stringify(tree));}catch(e){}}if(ch)ch.postMessage(1);fire();}
  const refresh=()=>{tree=read();fire();};
  if(ch)ch.onmessage=refresh;
  if(!mem)window.addEventListener('storage',e=>{if(e.key===K)refresh();});

  return{
    mode:'local',
    on(path,cb){const s={path,cb,last:undefined};subs.push(s);setTimeout(()=>{s.last=JSON.stringify(getP(tree,path));cb(getP(tree,path));},0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};},
    get(path){return Promise.resolve(clone(getP(tree,path)));},

    update(path,obj){tree=read();for(const k in obj)tree=setP(tree,(path?path+'/':'')+k,obj[k]);commit();return Promise.resolve();},
    remove(path){tree=read();tree=setP(tree,path,null);commit();return Promise.resolve();},
    tx(path,fn){tree=read();const v=fn(clone(getP(tree,path)));if(v!==undefined){tree=setP(tree,path,v);commit();}return Promise.resolve({committed:v!==undefined});},
    now(){return Date.now();},
    uid(){return bid;},
    ensureUser(){return Promise.resolve({uid:bid,isAnonymous:true});}
  };
}
/* memória pura (teste dentro da engine) */
function memoryBackend(){return localBackend('mem',true);}
/* Decide a conexão: com a trava do site principal -> Firebase único "jogos-github";
